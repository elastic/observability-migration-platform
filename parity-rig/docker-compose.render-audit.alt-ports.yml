# Alternate-port render-audit stack when 9200/5601 are occupied.
# Host ports: Elasticsearch 9220, Kibana 5620.
#
#   STACK_VERSION=9.5.0-SNAPSHOT docker compose \
#     -f docker-compose.render-audit.alt-ports.yml up -d --wait
#   ES_URL=http://localhost:9220 KIBANA_URL=http://localhost:5620 \
#     bash ../scripts/run_interaction_audit_local.sh

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.0-SNAPSHOT}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9220:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.5.0-SNAPSHOT}
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - SERVER_PUBLICBASEURL=http://localhost:5620
    ports:
      - "5620:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60

# OpenTelemetry Collector config for the Redis 763 curated-pack validation rig.
# Scrapes redis_exporter (Prometheus exposition format) and pushes to
# Elasticsearch as metrics data streams so ES|QL panels have live data.
# Index pattern: metrics-redis.prometheus-default
receivers:
  prometheus:
    config:
      global:
        scrape_interval: 10s
        external_labels:
          cluster: redis-rig
          namespace: default
      scrape_configs:
        - job_name: redis_exporter
          static_configs:
            - targets: [redis_exporter:9121]
              labels:
                instance: "redis:6379"
                namespace: "default"
            - targets: [redis_exporter_b:9121]
              labels:
                instance: "redis-b:6379"
                namespace: "staging"

processors:
  resourcedetection:
    detectors: []
  resource:
    attributes:
      - key: data_stream.type
        value: metrics
        action: insert
      - key: data_stream.dataset
        value: redis.prometheus
        action: insert
      - key: data_stream.namespace
        value: default
        action: insert

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 500
  elasticsearch:
    endpoints: [http://elasticsearch:9200]
    mapping:
      mode: ecs
    flush:
      interval: 5s
      bytes: 524288

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resource]
      exporters: [elasticsearch]

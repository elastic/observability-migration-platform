global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: redis-rig
    namespace: default

scrape_configs:
  - job_name: redis_exporter
    static_configs:
      - targets:
          - redis_exporter:9121
        labels:
          instance: redis:6379
          namespace: default

# ES ingestion is handled by the OTEL Collector (otelcol service) which scrapes
# redis_exporter independently and pushes via the elasticsearch exporter.

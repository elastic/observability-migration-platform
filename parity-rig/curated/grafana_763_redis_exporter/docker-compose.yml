#
# Redis 763 curated-pack validation rig
# Usage:
#   cd parity-rig/curated/grafana_763_redis_exporter
#   docker compose up -d --wait
#
# Ports (non-conflicting with the main parity rig):
#   9201 → Elasticsearch
#   5602 → Kibana
#   3001 → Grafana
#   9091 → Prometheus
#   9122 → redis_exporter (instance redis:6379 / namespace default)
#   9123 → redis_exporter_b (instance redis-b:6379 / namespace staging)
#   9101 → node_exporter
#   9104 → mysqld_exporter
#   9187 → postgres_exporter
#   6380 → Redis (default)
#   6381 → Redis B (staging)

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0-SNAPSHOT
    container_name: redis-rig-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.license.self_generated.type=trial
    ports:
      - "9201:9200"
    networks:
      - redis-rig
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.0-SNAPSHOT
    container_name: redis-rig-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
      - SERVER_NAME=kibana
    ports:
      - "5602:5601"
    networks:
      - redis-rig
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5601/api/status"]
      interval: 15s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: redis-rig-redis
    ports:
      - "6380:6379"
    networks:
      - redis-rig
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Seed some activity so panels show data
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru

  redis-load:
    image: redis:7-alpine
    container_name: redis-rig-load
    networks:
      - redis-rig
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          for i in $(seq 1 50); do
            redis-cli -h redis SET "key:$$i" "value:$$i" EX 300 > /dev/null
            redis-cli -h redis GET "key:$$i" > /dev/null
            redis-cli -h redis GET "key:missing:$$i" > /dev/null
          done
          sleep 5
        done

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-rig-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9122:9121"
    networks:
      - redis-rig
    depends_on:
      redis:
        condition: service_healthy

  # Second Redis target so Grafana/Kibana instance + namespace controls have
  # more than one concrete option to filter on.
  redis-b:
    image: redis:7-alpine
    container_name: redis-rig-redis-b
    ports:
      - "6381:6379"
    networks:
      - redis-rig
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 32mb
      --maxmemory-policy allkeys-lru

  redis-b-load:
    image: redis:7-alpine
    container_name: redis-rig-load-b
    networks:
      - redis-rig
    depends_on:
      redis-b:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          for i in $(seq 1 25); do
            redis-cli -h redis-b SET "staging:key:$$i" "value:$$i" EX 300 > /dev/null
            redis-cli -h redis-b GET "staging:key:$$i" > /dev/null
            redis-cli -h redis-b GET "staging:missing:$$i" > /dev/null
          done
          sleep 7
        done

  redis_exporter_b:
    image: oliver006/redis_exporter:latest
    container_name: redis-rig-exporter-b
    environment:
      - REDIS_ADDR=redis://redis-b:6379
    ports:
      - "9123:9121"
    networks:
      - redis-rig
    depends_on:
      redis-b:
        condition: service_healthy

  # Additional exporters so the parity gate has real data for the dashboards we
  # audit panel-by-panel (Node Exporter Full, MySQL Overview, PostgreSQL). Without
  # them every panel compares against a redis-only index and reports DATA_GAP,
  # which verifies nothing and cannot show whether a panel lights up.
  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: redis-rig-node-exporter
    # Node Exporter Full expects a fully instrumented host. These collectors are
    # off by default but do work in a container, and each lights up panels that
    # would otherwise report a data gap. Deliberately NOT enabled: systemd (no
    # dbus socket) and interrupts (/proc/interrupts is empty in Docker Desktop's
    # VM) -- both only log a collector error every scrape. Hardware sensors
    # (hwmon, cooling_device, power_supply, cpu scaling) are unavailable for the
    # same reason, so those panels stay honest data gaps.
    # Mount the host root so filesystem collectors see real mountpoints. Without
    # it only the container's own tmpfs /var and /tmp exist, so every panel that
    # filters mountpoint="/" (RootFS Total, Root FS Used, Disk Space Used) is
    # empty -- and Grafana against the same exporter would be equally empty.
    volumes:
      - /:/host:ro
    command:
      - --path.rootfs=/host
      - --collector.processes
      - --collector.tcpstat
      - --collector.netdev
      - --collector.netstat
      - --collector.sockstat
      - --collector.meminfo
      - --collector.vmstat
      - --collector.schedstat
    pid: host
    ports:
      - "9101:9100"
    networks:
      - redis-rig

  mysql:
    image: mysql:8.0
    container_name: redis-rig-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rigpass
      - MYSQL_DATABASE=rigdb
    networks:
      - redis-rig
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -prigpass || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mysqld_exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: redis-rig-mysqld-exporter
    environment:
      - MYSQLD_EXPORTER_PASSWORD=rigpass
    command:
      - --mysqld.username=root
      - --mysqld.address=mysql:3306
      - --collect.global_status
      - --collect.global_variables
      - --collect.info_schema.innodb_metrics
      - --collect.info_schema.processlist
    ports:
      - "9104:9104"
    networks:
      - redis-rig
    depends_on:
      mysql:
        condition: service_healthy

  # Drive real mysqld_exporter series (commands, questions, handlers, InnoDB,
  # processlist) so Grafana 7362 is not an idle SHOW STATUS scrape.
  mysql-load:
    image: mysql:8.0
    container_name: redis-rig-mysql-load
    networks:
      - redis-rig
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mysql_cmd="mysql -h mysql -uroot -prigpass -Drigdb --connect-timeout=5"
        until $$mysql_cmd -e "SELECT 1" >/dev/null 2>&1; do sleep 2; done
        $$mysql_cmd -e "
          CREATE TABLE IF NOT EXISTS rig_load (
            id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            k INT NOT NULL,
            v VARCHAR(64),
            KEY k (k)
          ) ENGINE=InnoDB;
          CREATE TABLE IF NOT EXISTS rig_scan (
            id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            payload VARCHAR(128)
          ) ENGINE=InnoDB;
        "
        i=0
        while true; do
          i=$$((i + 1))
          $$mysql_cmd -e "
            START TRANSACTION;
            INSERT INTO rig_load (k, v) VALUES ($$i, CONCAT('val-', $$i));
            UPDATE rig_load SET v = CONCAT('upd-', $$i) WHERE k = $$i;
            SELECT v FROM rig_load WHERE k = $$i;
            INSERT INTO rig_scan (payload) VALUES (REPEAT('x', 32));
            SELECT COUNT(*) FROM rig_scan;
            SELECT payload FROM rig_scan ORDER BY payload LIMIT 20;
            DELETE FROM rig_load WHERE id < $$((i - 400));
            COMMIT;
          " >/dev/null 2>&1
          $$mysql_cmd -e "SHOW PROCESSLIST; SHOW STATUS LIKE 'Threads%';" >/dev/null 2>&1
          sleep 0.25
        done

  # Drive real postgres_exporter series (tup_*, xact_*) so Grafana 9628
  # insert/update/delete graphs are not an idle scrape of zeros.
  postgres-load:
    image: postgres:16-alpine
    container_name: redis-rig-postgres-load
    networks:
      - redis-rig
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - PGPASSWORD=rigpass
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until pg_isready -h postgres -U postgres >/dev/null 2>&1; do sleep 2; done
        psql -h postgres -U postgres -d rigdb -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
        psql -h postgres -U postgres -d rigdb -c "
          CREATE TABLE IF NOT EXISTS rig_load (
            id SERIAL PRIMARY KEY,
            k INT NOT NULL,
            v VARCHAR(64)
          );
        "
        i=0
        while true; do
          i=$$((i + 1))
          psql -h postgres -U postgres -d rigdb -c "
            BEGIN;
            INSERT INTO rig_load (k, v) VALUES ($$i, CONCAT('val-', $$i));
            UPDATE rig_load SET v = CONCAT('upd-', $$i) WHERE k = $$i;
            SELECT v FROM rig_load WHERE k = $$i;
            DELETE FROM rig_load WHERE id < $$((i - 10));
            COMMIT;
          " >/dev/null 2>&1
          sleep 0.25
        done

  postgres:
    image: postgres:16-alpine
    container_name: redis-rig-postgres
    environment:
      - POSTGRES_PASSWORD=rigpass
      - POSTGRES_DB=rigdb
    # Preload pg_stat_statements so the exporter's stat_statements collector has
    # a view to read. Grafana 12485 "Query rate" / "Average query runtime" panels
    # depend on pg_stat_statements_* series; without the extension they are an
    # honest data gap rather than a rendered panel.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
    networks:
      - redis-rig
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: redis-rig-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:rigpass@postgres:5432/rigdb?sslmode=disable
    # stat_statements: Query rate / Average query runtime panels (Grafana 12485).
    # postmaster: pg_postmaster_start_time_seconds for the PostgreSQL Uptime panel.
    # Both collectors are off by default in postgres_exporter v0.15.0.
    command:
      - "--collector.stat_statements"
      - "--collector.postmaster"
    ports:
      - "9187:9187"
    networks:
      - redis-rig
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: redis-rig-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    networks:
      - redis-rig
    depends_on:
      - redis_exporter
      - redis_exporter_b
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d

  # Synthetic Kubernetes exporter (cAdvisor + kube-state-metrics + node_exporter)
  # so the Kubernetes curated packs (Grafana 315 + 6417) validate on real data.
  k8s_exporter:
    image: python:3.11-slim
    container_name: redis-rig-k8s-exporter
    volumes:
      - ./k8s_exporter.py:/app/k8s_exporter.py:ro
    working_dir: /app
    command: ["python", "k8s_exporter.py"]
    networks:
      - redis-rig

  redis-scraper:
    image: python:3.11-slim
    container_name: redis-rig-scraper
    volumes:
      - ./redis_scraper.py:/app/redis_scraper.py:ro
    working_dir: /app
    command: >
      /bin/sh -c "pip install requests --quiet && python redis_scraper.py"
    networks:
      - redis-rig
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis_exporter:
        condition: service_started
      redis_exporter_b:
        condition: service_started
      node_exporter:
        condition: service_started
      mysqld_exporter:
        condition: service_started
      postgres_exporter:
        condition: service_started
      k8s_exporter:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: redis-rig-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - ./grafana_provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - redis-rig
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20

networks:
  redis-rig:
    driver: bridge

# Local Elasticsearch + Kibana with security DISABLED, so the render-audit gate
# (headless Chrome) can drive dashboards in CI without the cloud SAML SSO wall
# that blocks automation against serverless. Not for production — a throwaway
# single-node stack for render verification only.
#
#   STACK_VERSION=9.5.0-SNAPSHOT docker compose -f docker-compose.render-audit.yml up -d --wait
#   bash ../scripts/run_render_audit_local.sh
#   docker compose -f docker-compose.render-audit.yml down -v

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.0-SNAPSHOT}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.5.0-SNAPSHOT}
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - SERVER_PUBLICBASEURL=http://localhost:5601
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60

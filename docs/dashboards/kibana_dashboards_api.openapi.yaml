    put:
      description: 'Creates a new dashboard with the given ID if none exists, or replaces
        the complete state of an

        existing one.


        > warn

        > This is a full replacement. Any panels not included in the request body
        are permanently

        > removed. To make targeted changes, retrieve the current state first with

        > GET /api/dashboards/{id}, apply your changes, and submit the full updated
        object.


        You can optionally include `access_control.access_mode` to change the dashboard
        access mode.

        If the authenticated user is not authorized to change access mode for the
        target dashboard,

        the request returns a `403` response with a descriptive `message`.

        '
      operationId: put-dashboards-id
      parameters:
      - description: A required header to protect against CSRF attacks
        in: header
        name: kbn-xsrf
        required: true
        schema:
          example: 'true'
          type: string
      - description: The unique ID of the dashboard to be created or updated
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-dashboard-data'
      responses:
        '200':
          content:
            application/json:
              examples:
                updateDashboardResponse:
                  description: 'The complete updated dashboard state after a full
                    replacement. Note that `meta.created_at` is not returned in update
                    responses - use the GET endpoint to retrieve it.

                    '
                  summary: Update dashboard response
                  value:
                    data:

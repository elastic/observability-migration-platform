components:
  schemas:
    Kibana_HTTP_APIs_aiops_change_point_chart:
      additionalProperties: false
      description: Change point detection chart embeddable schema
      properties:
        aggregation_function:
          default: avg
          description: The aggregation function used to calculate the metric values.
          enum:
          - avg
          - sum
          - min
          - max
          type: string
        data_view_id:
          description: The data view ID used to run change point detection.
          maxLength: 10000
          minLength: 1
          type: string
        description:
          description: A short description of the panel.
          type: string
        hide_border:
          description: When true, the panel border is hidden. Defaults to false.
          type: boolean
        hide_title:
          description: When true, the panel title is hidden. Defaults to false.
          type: boolean
        max_series_to_plot:
          default: 6
          description: The maximum number of change points to visualize. Defaults
            to 6.
          maximum: 50
          minimum: 1
          type: number
        metric_field:
          description: The metric field used by the aggregation function.
          maxLength: 10000
          minLength: 1
          type: string
        partitions:
          description: Optional split field values to include in the panel.
          items:
            maxLength: 10000
            minLength: 1
            type: string
          maxItems: 10000
          type: array
        split_field:
          description: The optional field used to split change point results.
          maxLength: 10000
          minLength: 1
          type: string
        time_range:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-es-query-server-timeRangeSchema'
        title:
          description: The panel title.
          type: string
        view_type:
          default: charts
          description: The type of change point detection view to display.
          enum:
          - charts
          - table
          type: string
      required:
      - data_view_id
      - metric_field
      title: aiops_change_point_chart
      type: object
    Kibana_HTTP_APIs_aiops_log_rate_analysis:
      additionalProperties: false
      description: Log rate analysis embeddable schema
      properties:
        data_view_id:
          description: The data view ID used to run log rate analysis.
          maxLength: 1000
          minLength: 1
          type: string
        description:
          description: A short description of the panel.
          type: string
        hide_border:
          description: When true, the panel border is hidden. Defaults to false.
          type: boolean
        hide_title:
          description: When true, the panel title is hidden. Defaults to false.
          type: boolean
        time_range:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-es-query-server-timeRangeSchema'
        title:
          description: The panel title.
          type: string
      required:
      - data_view_id
      title: aiops_log_rate_analysis
      type: object
    Kibana_HTTP_APIs_aiops_pattern_analysis:
      additionalProperties: false
      description: Log Pattern Analysis embeddable schema
      properties:
        data_view_id:
          description: The data view ID used for pattern analysis.
          maxLength: 1000
          minLength: 1
          type: string
        description:
          description: A short description of the panel.
          type: string
        field_name:
          description: The text field on which to run pattern analysis.
          maxLength: 1000
          minLength: 1
          type: string
        hide_border:
          description: When true, the panel border is hidden. Defaults to false.
          type: boolean
        hide_title:
          description: When true, the panel title is hidden. Defaults to false.
          type: boolean
        minimum_time_range:
          default: no_minimum
          description: Minimum time range for pattern analysis.
          enum:
          - no_minimum
          - 1_week
          - 1_month
          - 3_months
          - 6_months
          type: string
        random_sampler_mode:
          default: on_automatic
          description: The random sampler mode.
          enum:
          - on_automatic
          - on_manual
          - false
          type: string
        random_sampler_probability:
          default: null
          description: The probability to use for random sampling (between 0.00001
            and 0.5).
          maximum: 0.5
          minimum: 1.0e-05
          nullable: true
          type: number
        time_range:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-es-query-server-timeRangeSchema'
        title:
          description: The panel title.
          type: string
      required:
      - data_view_id
      - field_name
      title: aiops_pattern_analysis
      type: object
    Kibana_HTTP_APIs_apm-service-map-embeddable:

          items:
            anyOf:
            - additionalProperties: false
              default:
                open_in_new_tab: false
                use_filters: true
                use_time_range: true
              properties:
                dashboard_id:
                  type: string
                label:
                  type: string
                open_in_new_tab:
                  default: false
                  description: When enabled, the dashboard opens in a new browser
                    tab.
                  type: boolean
                trigger:
                  enum:
                  - on_apply_filter
                  type: string
                type:
                  enum:
                  - dashboard_drilldown
                  type: string
                use_filters:
                  default: true
                  description: When enabled, filters are passed to the opening dashboard.
                  type: boolean
                use_time_range:
                  default: true
                  description: When enabled, time range is passed to the opening dashboard.
                  type: boolean
              required:
              - dashboard_id
              - label
              - trigger
              - type
              title: dashboard_drilldown
              type: object
            - additionalProperties: false
              properties:
                label:
                  type: string
                open_in_new_tab:
                  default: true
                  type: boolean
                trigger:
                  enum:
                  - on_apply_filter
                  type: string
                type:
                  enum:
                  - discover_drilldown
                  type: string
              required:
              - label
              - trigger
              - type
              title: discover_drilldown
              type: object
            - additionalProperties: false
              properties:
                encode_url:
                  default: true
                  description: When true, URL is escaped using percent encoding
                  type: boolean
                label:
                  type: string
                open_in_new_tab:
                  default: true
                  type: boolean
                trigger:
                  enum:
                  - on_click_row
                  - on_click_value
                  - on_open_panel_menu
                  - on_select_range
                  type: string
                type:
                  enum:
                  - url_drilldown
                  type: string
                url:
                  description: Templated Url. Variables documented at https://www.elastic.co/docs/explore-analyze/dashboards/drilldowns#url-template-variable
                  type: string
              required:
              - url
              - label
              - trigger
              - type
              title: url_drilldown
              type: object
          maxItems: 100
          type: array
        filters:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_lensPanelFilters'
        group_by:
          description: Array of breakdown dimensions (minimum 1)
          items:
            additionalProperties: false
            type: object
            properties:

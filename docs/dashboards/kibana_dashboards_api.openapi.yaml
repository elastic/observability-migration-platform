openapi: 3.0.3
info:
  contact:
    name: Kibana Team
  description: 'Use the Kibana Dashboards API to programmatically create, retrieve,
    update, and delete dashboards.


    ## Stability


    | 9.4 | 9.5 | Serverless |

    | --- | --- | --- |

    | Experimental | Generally available ¹ | Generally available ² |


    ¹ This version introduces breaking changes. Refer to the [Kibana release notes](https://www.elastic.co/docs/release-notes/kibana/breaking-changes).


    ² On July 13, 2026, a new version of this API releases on Elastic Cloud Serverless
    and introduces breaking changes. Refer to the [Elastic Cloud Serverless release
    notes](https://www.elastic.co/docs/release-notes/cloud-serverless/breaking-changes).


    ## About this documentation


    This documentation is valid for Kibana 9.5 and Elastic Cloud Serverless. It is
    derived from the `main` branch of the [kibana](https://github.com/elastic/kibana)
    repository, so it reflects only the latest state of this API. To learn about changes
    between versions, refer to the release notes. This content is provided under [Attribution-NonCommercial-NoDerivatives
    4.0 International](https://creativecommons.org/licenses/by-nc-nd/4.0/).


    Not using the latest? Find the specifications of previous versions:


    - [Kibana 9.4 (experimental)](https://github.com/elastic/dashboards-api-spec/blob/main/openapi/archive/kibana-openapi-9.4-experimental.yaml)'
  title: Kibana Dashboards API
  version: ''
  x-doc-license:
    name: Attribution-NonCommercial-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/
  x-feedbackLink:
    label: Feedback
    url: https://github.com/elastic/docs-content/issues/new?assignees=&labels=feedback%2Ccommunity&projects=&template=api-feedback.yaml&title=%5BFeedback%5D%3A+

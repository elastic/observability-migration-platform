- url: https://{kibana_url}
  variables:
    kibana_url:
      default: localhost:5601
security:
- apiKeyAuth: []
- basicAuth: []
tags:
- name: Dashboards
  description: "A [dashboard](https://www.elastic.co/docs/explore-analyze/dashboards)\
    \ is a collection of panels arranged on a grid. Each panel can contain a visualization,\
    \ a Discover session, an image, markdown text, or an interactive filter control.\
    \ Use this API to create and manage dashboards programmatically.\n\n## When to\
    \ use this API\n\n- Use this API to define a complete, self-contained dashboard\
    \ in a single payload, including inline visualizations (both data view and ES|QL\
    \ based), controls, and filters.\n- Use the [Visualizations API](visualizations.html#tag/Visualizations)\
    \ to create reusable charts saved to your [visualization library](https://www.elastic.co/docs/explore-analyze/visualize/visualize-library).\
    \ You can then embed them in dashboards as linked panels using their ID.\n\n##\
    \ Get started\n\nBefore you begin:\n\n- **Authentication**: Refer to [Authentication](https://www.elastic.co/docs/api/doc/kibana#authentication)\
    \ in the Kibana API documentation.\n- **CSRF protection**: Write operations (`POST`,\
    \ `PUT`, `DELETE`) require the `kbn-xsrf: true` header.\n- **Spaces**: If you\
    \ use non-default [Kibana spaces](https://www.elastic.co/docs/deploy-manage/manage-spaces),\
    \ prepend `s/{space_id}/` to the path.\n\n### Try it now\n\nCreate your first\
    \ dashboard right now. The following example creates a dashboard with an ES|QL\
    \ line chart showing log entries over time. You can run it as-is once you have\
    \ the [Kibana sample logs dataset](https://www.elastic.co/docs/manage-data/ingest/sample-data)\
    \ installed:\n\n```bash\ncurl -X POST \"${KIBANA_URL}/api/dashboards\" \\\n  -H\
    \ \"Authorization: ApiKey ${API_KEY}\" \\\n  -H \"kbn-xsrf: true\" \\\n  -H \"\
    Content-Type: application/json\" \\\n  -d '{\n    \"title\": \"My first API dashboard\"\
    ,\n    \"panels\": [\n      {\n        \"grid\": {\n          \"x\": 0,\n    \
    \      \"y\": 0,\n          \"w\": 24,\n          \"h\": 10\n        },\n    \
    \    \"type\": \"vis\",\n        \"config\": {\n          \"type\": \"xy\",\n\
    \          \"title\": \"Total log entries over time\",\n          \"layers\":\
    \ [\n            {\n              \"type\": \"line\",\n              \"data_source\"\
    : {\n                \"type\": \"esql\",\n                \"query\": \"FROM kibana_sample_data_logs\
    \ | STATS count = COUNT() BY BUCKET(@timestamp, 75, ?_tstart, ?_tend)\"\n    \
    \          },\n              \"x\": {\n                \"column\": \"BUCKET(@timestamp,\
    \ 75, ?_tstart, ?_tend)\"\n              },\n              \"y\": [\n        \
    \        {\n                  \"column\": \"count\"\n                }\n     \
    \         ]\n            }\n          ],\n          \"axis\": {\n            \"\
    x\": {\n              \"title\": {\n                \"visible\": false\n     \
    \         }\n            }\n          }\n        }\n      }\n    ]\n  }'\n```\n\
    \nAll examples on this page use [Kibana sample datasets](https://www.elastic.co/docs/manage-data/ingest/sample-data)\
    \ (`kibana_sample_data_logs`, `kibana_sample_data_ecommerce`, `kibana_sample_data_flights`).\
    \ To use your own data, replace the `FROM` pattern and field references.\n\n###\
    \ Dashboard structure\n\nA [dashboard](https://www.elastic.co/docs/explore-analyze/dashboards)\
    \ is structured as follows:\n\n- **`title`** (required): the display name of the\
    \ dashboard.\n- **`panels`**: array of items placed on a 48-column grid. Each\
    \ item has a `type`, a `grid` position (`x`, `y`, `w`, `h`), and a `config`. Two\
    \ item shapes are supported:\n  - **Panel**: any content type, including visualizations,\
    \ Discover sessions, images, markdown, and filter controls. The `type` field determines\
    \ the panel's content and the structure of its `config`.\n  - **Section**: a collapsible\
    \ group of panels. Use sections to organize a large dashboard into logical groups.\
    \ A section has a `grid.y` position and its own nested `panels` array.\n\n  The\
    \ grid is 48 columns wide. Use `w: 48` for a full-width panel, `w: 24` for half-width,\
    \ and so on. Height (`h`) and vertical position (`y`) are in grid rows with no\
    \ fixed maximum.\n- **`pinned_panels`**: filter controls pinned at the top of\
    \ the dashboard that apply to all panels. Filter controls placed in `panels` apply\
    \ only to panels in the same section.\n- **`filters`**, **`query`**, **`time_range`**:\
    \ filter the data displayed across all panels.\n\n### Panel types\n\nThe `type`\
    \ field in each panel determines what it contains and the structure of its `config`:\n\
    \n| Type | Description |\n|------|-------------|\n| `vis` | Visualization (bar,\
    \ line, metric, and so on), supports both data view and ES&#124;QL queries |\n\
    | `discover_session` | Discover session |\n| `image` | Image |\n| `markdown` |\
    \ Markdown text |\n| `links` | Navigation links to dashboards and external URLs\
    \ |\n| `esql_control` | ES&#124;QL variable control |\n| `options_list_control`\
    \ | Dropdown filter by field value |\n| `range_slider_control` | Slider filter\
    \ by numeric range |\n| `time_slider_control` | Time range slider |\n\nAdditional\
    \ panel types for observability use cases:\n\n| Type | Description |\n|------|-------------|\n\
    | `slo_alerts` | SLO alerts |\n| `slo_burn_rate` | SLO burn rate |\n| `slo_error_budget`\
    \ | SLO error budget |\n| `slo_overview` | SLO overview |\n| `synthetics_monitors`\
    \ | Synthetics monitors |\n| `synthetics_stats_overview` | Synthetics stats overview\
    \ |\n| `apm_service_map` | APM service map |\n\nAdditional panel types for machine\
    \ learning use cases:\n\n| Type | Description |\n|------|-------------|\n| `ml_single_metric_viewer`\
    \ | Single metric viewer |\n| `ml_anomaly_swimlane` | Anomaly swim lane |\n| `ml_anomaly_charts`\
    \ | Anomaly charts |\n| `aiops_change_point_chart` | Change point detection chart\
    \ |\n| `aiops_log_rate_analysis` | Log rate analysis |\n| `aiops_pattern_analysis`\
    \ | Pattern analysis |\n| `field_stats_table` | Field statistics table |\n\n>\
    \ info\n> The following panel types are supported in the Kibana UI but not yet\
    \ by the REST API: `map`, `legacy_vis`. Write operations (`POST`, `PUT`) return\
    \ a `400` error when these panel types are included. Read operations (`GET`) strip\
    \ these panels from the response and include them in a list of warnings.\n\n###\
    \ Embedding library items\n\n`vis`, `discover_session`, `markdown`, and `links`\
    \ panels can be embedded **inline** (full config stored in the dashboard) or **linked\
    \ from library** (references a library item by ID).\n\nFor the full `config` schema\
    \ for visualization panels, including chart types, metric operations, and breakdowns,\
    \ refer to the [Visualizations API](visualizations.html#tag/Visualizations).\n\
    \n- **Inline**: use when the panel is specific to this dashboard or must work\
    \ across Kibana spaces. The panel configuration goes directly inside `config`:\n\
    \n  ```json\n  {\n    \"grid\": {\n      \"x\": 0,\n      \"y\": 0,\n      \"\
    w\": 12,\n      \"h\": 8\n    },\n    \"type\": \"vis\",\n    \"config\": {\n\
    \      \"type\": \"metric\",\n      \"title\": \"Average bytes\",\n      \"data_source\"\
    : {\n        \"type\": \"data_view_spec\",\n        \"index_pattern\": \"kibana_sample_data_logs\"\
    ,\n        \"time_field\": \"timestamp\"\n      },\n      \"metrics\": [\n   \
    \     {\n          \"type\": \"primary\",\n          \"operation\": \"average\"\
    ,\n          \"field\": \"bytes\"\n        }\n      ]\n    }\n  }\n  ```\n\n-\
    \ **Linked from library**: references an item in your library by its ID. Use `ref_id`\
    \ with any supported panel type (`vis`, `discover_session`, `markdown`, `links`).\
    \ Use the [Visualizations API](visualizations.html#tag/Visualizations) to create\
    \ and retrieve IDs for visualization items.\n\n  ```json\n  {\n    \"grid\": {\n\
    \      \"x\": 0,\n      \"y\": 0,\n      \"w\": 12,\n      \"h\": 8\n    },\n\
    \    \"type\": \"vis\",\n    \"config\": {\n      \"ref_id\": \"1e4f0a30-b3c5-11ef-bd7a-2b6b1a8c0f3d\"\
    \n    }\n  }\n  ```\n\n### ES|QL visualizations\n\nTo create ES|QL-based charts,\
    \ embed them inline as `vis` panels and set `data_source.type` to `\"esql\"`.\n\
    \n- **`metric` charts**: reference query result columns in `metrics` using `column`:\n\
    \n  ```json\n  {\n    \"grid\": {\n      \"x\": 0,\n      \"y\": 0,\n      \"\
    w\": 12,\n      \"h\": 6\n    },\n    \"type\": \"vis\",\n    \"config\": {\n\
    \      \"type\": \"metric\",\n      \"title\": \"Total requests\",\n      \"data_source\"\
    : {\n        \"type\": \"esql\",\n        \"query\": \"FROM logs-* | STATS count\
    \ = COUNT()\"\n      },\n      \"metrics\": [\n        {\n          \"type\":\
    \ \"primary\",\n          \"column\": \"count\"\n        }\n      ]\n    }\n \
    \ }\n  ```\n\n- **`xy` charts**: `data_source` goes inside each layer. Use `BUCKET(@timestamp,\
    \ 75, ?_tstart, ?_tend)` to align time-series buckets with the dashboard's selected\
    \ time range. For a complete xy chart example, see the [Create a dashboard](#operation/post-dashboards)\
    \ endpoint.\n"
  externalDocs:
    description: Dashboards documentation
    url: https://www.elastic.co/docs/explore-analyze/dashboards
  x-displayName: Dashboards
paths:
  /api/dashboards:
    get:
      description: Returns a paginated list of dashboards. Each result includes title,
        description, tags, and metadata, but not the full panel layout. Use `GET /api/dashboards/{id}`
        to retrieve the complete state.
      operationId: get-dashboards
      parameters:
      - description: The page of results to return.
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: number
      - description: The number of results to return per page.
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 1000
          minimum: 1
          type: number
      - description: Filters results by `title` and `description` using Elasticsearch
          [`simple_query_string`](https://www.elastic.co/docs/reference/query-languages/query-dsl/query-dsl-simple-query-string-query)
          syntax. Multi-word terms require all words to match.
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: A tag ID to include. Accepts a single tag ID or multiple tag
          IDs. When multiple are specified, library items matching any of the tag
          IDs are included.
        in: query
        name: tags
        required: false
        schema:
          default: []
          description: Tag IDs associated with this dashboard.
          items:
            maxLength: 250
            type: string
          maxItems: 100
          type: array
      - description: A tag ID to exclude. Accepts a single tag ID or multiple tag
          IDs. When multiple are specified, library items matching any of the tag
          IDs are excluded.
        in: query
        name: excluded_tags
        required: false
        schema:
          default: []
          description: Tag IDs associated with this dashboard.
          items:
            maxLength: 250
            type: string
          maxItems: 100
          type: array
      - description: A tag name to include. Accepts a single tag name or multiple
          tag names. When multiple are specified, library items matching any of the
          tag names are included. If the same name is shared by multiple tags, items
          matching any of those tags are included.
        in: query
        name: tag_names
        required: false
        schema:
          items:
            type: string
          maxItems: 100
          type: array
          x-state: Generally available; added in 9.6.0
      - description: A tag name to exclude. Accepts a single tag name or multiple
          tag names. When multiple are specified, library items matching any of the
          tag names are excluded. If the same name is shared by multiple tags, items
          matching any of those tags are excluded.
        in: query
        name: excluded_tag_names
        required: false
        schema:
          items:
            type: string
          maxItems: 100
          type: array
          x-state: Generally available; added in 9.6.0
      responses:
        '200':
          content:
            application/json:
              examples:
                searchDashboardsResponse:
                  description: 'Paginated list of dashboard summaries. Each item includes
                    the ID, a subset of dashboard state fields (`title`, `time_range`
                    if set), and metadata. Full panel content is not included - use
                    the GET endpoint to retrieve a specific dashboard.

                    '
                  summary: Search dashboards response
                  value:
                    data:
                    - data:
                        title: Web logs overview
                      id: 3c4b8e10-d57a-11ef-9a52-4f3c2a8d0e1b
                      meta:
                        created_at: 2026-04-13 10:00:00+00:00
                        managed: false
                        updated_at: 2026-04-13 10:00:00+00:00
                        version: WzEwMiwxXQ==
                    - data:
                        time_range:
                          from: now-7d
                          to: now
                        title: Operations overview
                      id: 7f2a1c40-e83b-11ef-a641-7d5b3f9e1c2a
                      meta:
                        created_at: 2026-04-12 08:00:00+00:00
                        managed: false
                        updated_at: 2026-04-12 14:22:00+00:00
                        version: WzEwMSwxXQ==
                    meta:
                      page: 1
                      per_page: 20
                      total: 2
              schema:
                anyOf:
                - additionalProperties: false
                  type: object
                  properties:
                    data:
                      description: List of dashboards matching the query. Each entry
                        includes summary fields but not the full panel layout.
                      items:
                        additionalProperties: false
                        type: object
                        properties:
                          data:
                            additionalProperties: false
                            type: object
                            properties:
                              access_control:
                                $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-dashboard-access-control'
                              description:
                                description: A short description of the dashboard.
                                type: string
                              tags:
                                description: Tag IDs associated with this dashboard.
                                items:
                                  maxLength: 250
                                  type: string
                                maxItems: 100
                                type: array
                              time_range:
                                $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-es-query-server-timeRangeSchema'
                              title:
                                description: The dashboard title.
                                type: string
                            required:
                            - title
                          id:
                            description: The dashboard ID.
                            type: string
                          meta:
                            $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-meta'
                        required:
                        - id
                        - data
                        - meta
                      maxItems: 1000
                      type: array
                    meta:
                      additionalProperties: false
                      type: object
                      properties:
                        page:
                          default: 1
                          description: The returned page of results.
                          minimum: 1
                          type: number
                        per_page:
                          default: 20
                          description: The number of results returned per page.
                          maximum: 1000
                          minimum: 1
                          type: number
                        total:
                          description: The total number of results matching the query.
                          type: number
                      required:
                      - total
                  required:
                  - data
                  - meta
                - additionalProperties: false
                  type: object
                  properties:
                    dashboards:
                      description: List of dashboards matching the query. Each entry
                        includes summary fields but not the full panel layout.
                      items:
                        additionalProperties: false
                        type: object
                        properties:
                          data:
                            additionalProperties: false
                            type: object
                            properties:
                              access_control:
                                $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-dashboard-access-control'
                              description:
                                description: A short description of the dashboard.
                                type: string
                              tags:
                                description: Tag IDs associated with this dashboard.
                                items:
                                  maxLength: 250
                                  type: string
                                maxItems: 1000
                                type: array
                              time_range:
                                $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-es-query-server-timeRangeSchema'
                              title:
                                description: The dashboard title.
                                type: string
                            required:
                            - title
                          id:
                            description: The dashboard ID.
                            type: string
                          meta:
                            $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-meta'
                        required:
                        - id
                        - data
                        - meta
                      type: array
                    page:
                      description: The page of results returned.
                      type: number
                    total:
                      description: The total number of dashboards matching the query.
                      type: number
                  required:
                  - dashboards
                  - page
                  - total
          description: success
        '400':
          description: bad request
        '403':
          description: forbidden
        '500':
          description: internal server error
      summary: Search dashboards
      tags:
      - Dashboards
      x-codeSamples:
      - label: Search dashboards - cURL
        lang: cURL
        source: "curl -X GET \"${KIBANA_URL}/api/dashboards?query=web+logs&per_page=10\"\
          \ \\\n  -H \"Authorization: ApiKey ${API_KEY}\"\n"
      - label: Search dashboards - Console
        lang: Console
        source: 'GET kbn:/api/dashboards?query=web+logs&per_page=10

          '
      - label: Filter by tag name - cURL
        lang: cURL_tag_names
        source: "curl -X GET \"${KIBANA_URL}/api/dashboards?tag_names=Security&tag_names=Observability\"\
          \ \\\n  -H \"Authorization: ApiKey ${API_KEY}\"\n"
      - label: Filter by tag name - Console
        lang: Console_tag_names
        source: 'GET kbn:/api/dashboards?tag_names=Security&tag_names=Observability

          '
      - label: Exclude by tag name - cURL
        lang: cURL_excluded_tag_names
        source: "curl -X GET \"${KIBANA_URL}/api/dashboards?excluded_tag_names=Deprecated\"\
          \ \\\n  -H \"Authorization: ApiKey ${API_KEY}\"\n"
      - label: Exclude by tag name - Console
        lang: Console_excluded_tag_names
        source: 'GET kbn:/api/dashboards?excluded_tag_names=Deprecated

          '
      x-state: Generally available; added in 9.5.0
      x-metaTags:
      - content: Kibana
        name: product_name
    post:
      description: Creates a new dashboard and returns its ID, full state, and metadata.
      operationId: post-dashboards
      parameters:
      - description: A required header to protect against CSRF attacks
        in: header
        name: kbn-xsrf
        required: true
        schema:
          example: 'true'
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-dashboard-data'
      responses:
        '201':
          content:
            application/json:
              examples:
                createDashboardResponse:
                  description: 'Response to creating a dashboard. Returns the generated
                    ID, the full dashboard state in `data`, and metadata. Default
                    option values are always returned even when not explicitly set
                    in the request. Panel `id` values are generated automatically.

                    '
                  summary: Create dashboard response
                  value:
                    data:
                      access_control:
                        access_mode: write_restricted
                      options:
                        auto_apply_filters: true
                        hide_panel_borders: false
                        hide_panel_titles: false
                        sync_colors: false
                        sync_cursor: true
                        sync_tooltips: false
                        use_margins: true
                      panels:
                      - config:
                          content: '## Web logs overview'
                        grid:
                          h: 15
                          w: 24
                          x: 0
                          y: 0
                        id: a1b2c3d4-0001-4000-8000-000000000001
                        type: markdown
                      - config:
                          data_source:
                            index_pattern: kibana_sample_data_logs
                            time_field: timestamp
                            type: data_view_spec
                          ignore_global_filters: false
                          metrics:
                          - empty_as_null: false
                            operation: count
                            type: primary
                          sampling: 1
                          styling:
                            primary:
                              labels:
                                alignment: left
                              position: bottom
                              value:
                                alignment: right
                                sizing: auto
                          title: ''
                          type: metric
                        grid:
                          h: 5
                          w: 12
                          x: 24
                          y: 0
                        id: a1b2c3d4-0001-4000-8000-000000000002
                        type: vis
                      - config:
                          data_source:
                            index_pattern: kibana_sample_data_logs
                            time_field: timestamp
                            type: data_view_spec
                          ignore_global_filters: false
                          metrics:
                          - field: bytes
                            operation: average
                            type: primary
                          sampling: 1
                          styling:
                            primary:
                              labels:
                                alignment: left
                              position: bottom
                              value:
                                alignment: right
                                sizing: auto
                          title: ''
                          type: metric
                        grid:
                          h: 5
                          w: 12
                          x: 36
                          y: 0
                        id: a1b2c3d4-0001-4000-8000-000000000003
                        type: vis
                      - config:
                          axis:
                            x:
                              domain:
                                rounding: false
                                type: fit
                              grid:
                                visible: true
                              labels:
                                orientation: horizontal
                              scale: ordinal
                              ticks:
                                visible: true
                              title:
                                visible: false
                            y:
                              anchor: start
                              domain:
                                rounding: true
                                type: full
                              grid:
                                visible: true
                              labels:
                                orientation: horizontal
                              scale: linear
                              ticks:
                                visible: true
                              title:
                                visible: true
                          layers:
                          - data_source:
                              query: FROM kibana_sample_data_logs | STATS count =
                                COUNT() BY BUCKET(@timestamp, 75, ?_tstart, ?_tend)
                              type: esql
                            ignore_global_filters: false
                            sampling: 1
                            type: line
                            x:
                              column: BUCKET(@timestamp, 75, ?_tstart, ?_tend)
                            y:
                            - axis_id: y
                              column: count
                          legend:
                            layout:
                              truncate:
                                max_lines: 1
                              type: grid
                            placement: outside
                            position: right
                            visibility: hidden
                          styling:
                            interpolation: linear
                            overlays:
                              current_time_marker:
                                visible: false
                              partial_buckets:
                                visible: false
                            points:
                              visibility: auto
                          title: Requests over time
                          type: xy
                        grid:
                          h: 10
                          w: 24
                          x: 24
                          y: 5
                        id: a1b2c3d4-0001-4000-8000-000000000003
                        type: vis
                      pinned_panels: []
                      title: Web logs overview
                    id: 3c4b8e10-d57a-11ef-9a52-4f3c2a8d0e1b
                    meta:
                      created_at: 2026-04-13 10:00:00+00:00
                      managed: false
                      updated_at: 2026-04-13 10:00:00+00:00
                      version: WzEwMiwxXQ==
              schema:
                additionalProperties: false
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-dashboard-data'
                  id:
                    description: The unique ID of the dashboard, as returned by the
                      create or search endpoints.

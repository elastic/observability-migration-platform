      description: APM service map embeddable schema
      properties:
        alert_status_filter:
          items:
            enum:
            - active
            - recovered
            - untracked
            - delayed
            type: string
          maxItems: 4
          type: array
        anomaly_severity_filter:
          items:
            enum:
            - critical
            - major
            - minor
            - warning
            - low
            - unknown
            type: string
          maxItems: 6
          type: array
        connection_filter:
          items:
            enum:
            - orphaned
            - connected
            type: string
          maxItems: 2
          type: array
        description:
          description: A short description of the panel.
          type: string
        environment:
          default: ENVIRONMENT_ALL
          maxLength: 1024
          type: string
        hide_border:
          description: When true, the panel border is hidden. Defaults to false.
          type: boolean
        hide_title:
          description: When true, the panel title is hidden. Defaults to false.
          type: boolean
        highlighted_service_names:
          items:
            maxLength: 1024
            type: string
          maxItems: 50
          type: array
        kuery:
          maxLength: 2048
          type: string
        map_orientation:
          enum:
          - horizontal
          - vertical
          type: string
        service_group_id:
          maxLength: 1024
          type: string
        service_name:
          maxLength: 1024
          type: string
        slo_status_filter:
          items:
            enum:
            - healthy
            - degrading
            - violated
            - noData
            type: string
          maxItems: 4
          type: array
        sync_with_dashboard_filters:
          type: boolean
        time_range:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-es-query-server-timeRangeSchema'
        title:
          description: The panel title.
          type: string
      title: apm-service-map-embeddable
      type: object
    Kibana_HTTP_APIs_autoColor:
      additionalProperties: false
      description: Coloring determined at runtime based on chart defaults
      properties:
        type:
          enum:
          - auto
          type: string
      required:
      - type
      title: Auto Color
      type: object
    Kibana_HTTP_APIs_byteFormat:
      additionalProperties: false
      description: Data size format in bits or bytes, with optional decimal places
        and suffix.
      properties:
        decimals:
          default: 2
          description: Number of decimal places to display.
          type: number
        suffix:
          description: Suffix appended to the formatted value.
          type: string
        type:
          description: 'Data size unit: `bits` or `bytes`.'
          enum:
          - bits
          - bytes
          type: string
      required:
      - type
      title: Byte Format
      type: object
    Kibana_HTTP_APIs_categoricalColorMapping:
      additionalProperties: false
      description: Palette color assignment for specific categorical values. Unmapped
        values receive the unassigned color.
      properties:
        mapping:
          items:
            additionalProperties: false
            type: object
            properties:
              color:
                anyOf:
                - $ref: '#/components/schemas/Kibana_HTTP_APIs_colorFromPalette'
                - $ref: '#/components/schemas/Kibana_HTTP_APIs_color_code'
              values:
                items:
                  anyOf:
                  - type: string
                  - type: number
                  - $ref: '#/components/schemas/Kibana_HTTP_APIs_range_key'
                  - $ref: '#/components/schemas/Kibana_HTTP_APIs_multi_field_key'
                maxItems: 1000
                type: array
            required:
            - values
            - color
          maxItems: 1000
          type: array
        mode:
          enum:
          - categorical
          type: string
        palette:
          description: 'Color palette name. Accepted values: ''default'', ''elastic_line_optimized'',
            ''severity'', ''eui_amsterdam'', ''kibana_v7_legacy'', ''elastic_brand_2023''.
            Defaults to `default`.'
          type: string
        unassigned:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_unassignedColorSchema'
      required:
      - mode
      - palette
      - mapping
      title: Categorical Color Mapping
      type: object
    Kibana_HTTP_APIs_collapseBy:
      description: Aggregation function used to collapse a breakdown dimension into
        a single value.
      enum:
      - avg
      - sum
      - max
      - min
      title: collapseBy
      type: string
    Kibana_HTTP_APIs_color_code:
      additionalProperties: false
      description: A color specified as a hex or CSS color code string.
      properties:
        type:
          enum:
          - color_code
          type: string
        value:
          description: The static color value to use.
          type: string
      required:
      - type
      - value
      title: Color Code
      type: object
    Kibana_HTTP_APIs_colorByValue:
      anyOf:
      - $ref: '#/components/schemas/Kibana_HTTP_APIs_colorByValueAbsolute'
      - $ref: '#/components/schemas/Kibana_HTTP_APIs_colorByValuePercentage'
      - $ref: '#/components/schemas/Kibana_HTTP_APIs_colorByValuePalette'
      - $ref: '#/components/schemas/Kibana_HTTP_APIs_legacyColorByValue'
      description: Dynamic color mapping by numeric range, with support for absolute
        and percentage-based ranges and for named palettes.
      title: Color By Value
    Kibana_HTTP_APIs_colorByValueAbsolute:
      additionalProperties: false
      description: Color by absolute value configuration
      properties:
        range:
          enum:
          - absolute
          type: string
        steps:
          description: Array of ordered color steps defining the range each color
            is applied.
          items:
            additionalProperties: false
            type: object
            properties:
              color:
                description: The color to use for this step.
                type: string
              gte:
                description: The lower bound of range from which this color applies
                  (inclusive).
                nullable: true
                type: number
              lt:
                description: The upper bound of range to which this color applies
                  (exclusive).
                nullable: true
                type: number
              lte:
                description: The upper bound of range to which this color applies
                  (inclusive).
                nullable: true
                type: number
            required:
            - color
          maxItems: 100
          minItems: 1
          type: array
        type:
          enum:
          - dynamic
          type: string
      required:
      - type
      - range
      - steps

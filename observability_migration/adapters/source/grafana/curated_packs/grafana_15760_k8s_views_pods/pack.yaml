        | STATS rx = SUM(RATE({{metric:container_network_receive_packets_total:counter}})), tx = SUM(RATE({{metric:container_network_transmit_packets_total:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)

        | WHERE {{metric:container_cpu_cfs_throttled_seconds_total:counter}} IS NOT NULL
        | STATS throttled_seconds = SUM(RATE({{metric:container_cpu_cfs_throttled_seconds_total:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:container}}
        | EVAL container = {{label:container}}
        | STATS throttled_seconds = AVG(throttled_seconds) BY time_bucket, container
        | KEEP time_bucket, container, throttled_seconds
        | SORT time_bucket ASC
    - title_match: "OOM Events by container"
      panel_id: 60
      approximation_note: "Increase over the dashboard time range, by container. The source axis max of 1 is kept."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (?cluster == "" OR ({{label:cluster}} RLIKE ?cluster OR ({{label:cluster}} IS NULL AND "" RLIKE ?cluster)))
        | WHERE (?namespace == "" OR ({{label:namespace}} RLIKE ?namespace OR ({{label:namespace}} IS NULL AND "" RLIKE ?namespace)))
        | WHERE (MV_COUNT(?pod) == 0 OR MV_CONTAINS(TO_STRING(?pod), ".*") OR MV_CONTAINS(TO_STRING(?pod), {{label:pod}}))
        | WHERE {{metric:container_oom_events_total:counter}} IS NOT NULL
        | STATS oom_events = SUM(INCREASE({{metric:container_oom_events_total:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:container}}
        | EVAL container = {{label:container}}
        | STATS oom_events = AVG(oom_events) BY time_bucket, container
        | KEEP time_bucket, container, oom_events
        | SORT time_bucket ASC
    - title_match: "Container Restarts by container"
      panel_id: 61
      approximation_note: "Increase over the dashboard time range, by container. An empty job selection shows every job; a chosen job keeps only that series. The source axis max of 1 is kept."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (?cluster == "" OR ({{label:cluster}} RLIKE ?cluster OR ({{label:cluster}} IS NULL AND "" RLIKE ?cluster)))
        | WHERE (?namespace == "" OR ({{label:namespace}} RLIKE ?namespace OR ({{label:namespace}} IS NULL AND "" RLIKE ?namespace)))
        | WHERE (MV_COUNT(?pod) == 0 OR MV_CONTAINS(TO_STRING(?pod), ".*") OR MV_CONTAINS(TO_STRING(?pod), {{label:pod}}))
        | WHERE (?job IS NULL OR ?job == "" OR MV_COUNT(?job) == 0 OR MV_CONTAINS(TO_STRING(?job), {{label:job}}))
        | WHERE {{metric:kube_pod_container_status_restarts_total:counter}} IS NOT NULL
        | STATS restarts = SUM(INCREASE({{metric:kube_pod_container_status_restarts_total:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:container}}
        | EVAL container = {{label:container}}
        | STATS restarts = AVG(restarts) BY time_bucket, container
        | KEEP time_bucket, container, restarts
        | SORT time_bucket ASC
    - title_match: "Pods with Container Issues"
      panel_id: 63
      kibana_type_override: datatable
      approximation_note: "Pods waiting on image pull or crash loop, cluster-wide, matching the source query which does not use the namespace or pod controls."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:reason}} == "ErrImagePull" OR {{label:reason}} == "ImagePullBackOff" OR {{label:reason}} == "CrashLoopBackOff"
        | WHERE {{metric:kube_pod_container_status_waiting_reason:gauge}} IS NOT NULL
        | STATS waiting = MAX(LAST_OVER_TIME({{metric:kube_pod_container_status_waiting_reason:gauge}})) BY {{label:namespace}}, {{label:pod}}, {{label:container}}, {{label:reason}}
        | EVAL namespace = {{label:namespace}}, pod = {{label:pod}}, container = {{label:container}}, reason = {{label:reason}}
        | WHERE waiting == 1
        | STATS waiting = MAX(waiting) BY namespace, pod, container, reason
        | KEEP namespace, pod, container, reason, waiting
        | SORT namespace ASC, pod ASC
    - title_match: "Unscheduled Pods"
      panel_id: 64
      kibana_type_override: datatable
      approximation_note: "Pods whose scheduled condition is false, cluster-wide, matching the source query."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:condition}} == "false"
        | WHERE {{metric:kube_pod_status_scheduled:gauge}} IS NOT NULL
        | STATS unscheduled = MAX(LAST_OVER_TIME({{metric:kube_pod_status_scheduled:gauge}})) BY {{label:namespace}}, {{label:pod}}
        | EVAL namespace = {{label:namespace}}, pod = {{label:pod}}
        | WHERE unscheduled == 1
        | STATS unscheduled = MAX(unscheduled) BY namespace, pod
        | KEEP namespace, pod, unscheduled
        | SORT namespace ASC, pod ASC
    - title_match: "Network - Bandwidth"
      panel_id: 31
      approximation_note: "Received is positive and transmitted is negative so the two directions mirror, matching the source. The rate window follows the dashboard time range. The resolution variable is a scrape step, not a Kibana control."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (?cluster == "" OR ({{label:cluster}} RLIKE ?cluster OR ({{label:cluster}} IS NULL AND "" RLIKE ?cluster)))
        | WHERE (?namespace == "" OR ({{label:namespace}} RLIKE ?namespace OR ({{label:namespace}} IS NULL AND "" RLIKE ?namespace)))
        | WHERE (MV_COUNT(?pod) == 0 OR MV_CONTAINS(TO_STRING(?pod), ".*") OR MV_CONTAINS(TO_STRING(?pod), {{label:pod}}))
        | WHERE {{metric:container_network_receive_bytes_total:counter}} IS NOT NULL OR {{metric:container_network_transmit_bytes_total:counter}} IS NOT NULL
        | STATS rx = SUM(RATE({{metric:container_network_receive_bytes_total:counter}})), tx = SUM(RATE({{metric:container_network_transmit_bytes_total:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | EVAL received = rx, transmitted = -1 * tx
        | KEEP time_bucket, received, transmitted
        | SORT time_bucket ASC

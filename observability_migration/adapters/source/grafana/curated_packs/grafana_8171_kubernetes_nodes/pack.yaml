#
# Curated pack — Grafana dashboard 8171
# https://grafana.com/grafana/dashboards/8171-kubernetes-nodes/
#
# Source: community "Kubernetes Nodes" (node_exporter 0.16+ via Prometheus).
# Revision 1. schemaVersion 16. 8 leaf panels + $server instance picker.
#
# The dashboard is already on modern node_exporter 0.16 names (`*_bytes`,
# `*_seconds_total`). Two source bugs are repaired so Kibana is strictly
# better than Grafana:
#   - "Idle CPU" computes 100 - idle = **busy** % (Grafana's own title is
#     wrong). The pack keeps that formula and renames the panel CPU Busy.
#   - "Disk I/O" queries `node_nfsd_disk_bytes_*` (NFS *server* counters)
#     plus `node_disk_io_time_seconds_total`. Most Kubernetes nodes are not
#     NFS servers, so Grafana's read/written series are empty. Map nfsd →
#     `node_disk_read_bytes_total` / `node_disk_written_bytes_total` and
#     name the series Read / Written / IO time.
#
# Engine vs pack split:
#   Engine: irate/rate counters, gauge subtraction for memory used, stacked
#           Memory Usage graph, singlestat percent gauges, $server exact
#           instance matcher, device!~"lo" / device!="rootfs" filters.
#   Pack:   metric_kinds, instance label pin, nfsd→disk metric_map, CPU Busy
#           per-cpu ES|QL + title rename, Disk I/O named series, Network
#           Received/Transmitted ES|QL (native PROMQL GROK+step is empty in Lens).

query:
  metrics_dataset_filter: "prometheus"

  metric_kinds:
    node_cpu_seconds_total: counter
    node_disk_io_time_seconds_total: counter
    node_disk_read_bytes_total: counter
    node_disk_written_bytes_total: counter
    node_nfsd_disk_bytes_read_total: counter
    node_nfsd_disk_bytes_written_total: counter
    node_network_receive_bytes_total: counter
    node_network_transmit_bytes_total: counter
    node_boot_time_seconds: gauge
    node_load1: gauge
    node_load5: gauge
    node_load15: gauge
    node_memory_MemTotal_bytes: gauge
    node_memory_MemFree_bytes: gauge
    node_memory_Buffers_bytes: gauge
    node_memory_Cached_bytes: gauge
    node_filesystem_size_bytes: gauge
    node_filesystem_free_bytes: gauge

  label_rewrites:
    instance: labels.instance
    cpu: labels.cpu
    device: labels.device
    mode: labels.mode

  # Grafana Disk I/O read/written series are NFS-server counters. Emit the
  # real node disk byte counters instead. Targets are bare logical metric
  # names; the resolver namespaces them by the active field profile.
  metric_map:
    node_nfsd_disk_bytes_read_total: node_disk_read_bytes_total
    node_nfsd_disk_bytes_written_total: node_disk_written_bytes_total

  label_candidates:
    instance:
      - labels.instance
      - service.instance.id
      - host.name
    cpu:
      - labels.cpu
    device:
      - labels.device

controls:
  field_overrides:
    server: labels.instance
    instance: labels.instance

panel:
  query_overrides:
    # Source title is "Idle CPU" but the PromQL is 100-idle = busy % per cpu.
    - title_match: "Idle CPU"
      kibana_type_override: line
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (?server == "" OR ({{label:instance}} RLIKE ?server OR ({{label:instance}} IS NULL AND "" RLIKE ?server)))
        | WHERE {{label:mode}} == "idle"
        | WHERE {{metric:node_cpu_seconds_total:counter}} IS NOT NULL
        | STATS idle_rate = AVG(IRATE({{metric:node_cpu_seconds_total:counter}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend), {{label:cpu}}
        | EVAL Busy = 100 * (1 - idle_rate)
        | WHERE Busy IS NOT NULL
        | KEEP time_bucket, `labels.cpu`, Busy
        | SORT time_bucket ASC
      status_override: migrated
    # Name Read/Written/IO time so the Lens legend is not leftover metric names.
    - title_match: "Disk I/O"
      kibana_type_override: line
      approximation_note: "Grafana queries node_nfsd_disk_bytes_* (NFS server); Kibana plots node_disk_read/written_bytes_total plus io_time so a Kubernetes node shows actual disk I/O."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (?server == "" OR ({{label:instance}} RLIKE ?server OR ({{label:instance}} IS NULL AND "" RLIKE ?server)))
        | WHERE {{metric:node_disk_read_bytes_total:counter}} IS NOT NULL OR {{metric:node_disk_written_bytes_total:counter}} IS NOT NULL OR {{metric:node_disk_io_time_seconds_total:counter}} IS NOT NULL
        | STATS Read = SUM(RATE({{metric:node_disk_read_bytes_total:counter}})), Written = SUM(RATE({{metric:node_disk_written_bytes_total:counter}})), `IO time` = SUM(RATE({{metric:node_disk_io_time_seconds_total:counter}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend)
        | KEEP time_bucket, Read, Written, `IO time`
        | SORT time_bucket ASC
    # Native PROMQL + GROK _timeseries + KEEP step returns rows at /_query, but
    # Lens XY paints "No results found" (x=step vs working time_bucket panels).
    # Force the same ES|QL shape as CPU Busy, and keep $server — the ES|QL
    # fallthrough drops the instance matcher.
    - title_match: "Network Received"
      kibana_type_override: line
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (?server == "" OR ({{label:instance}} RLIKE ?server OR ({{label:instance}} IS NULL AND "" RLIKE ?server)))
        | WHERE (NOT ({{label:device}} RLIKE "lo") OR ({{label:device}} IS NULL AND NOT ("" RLIKE "lo")))
        | WHERE {{metric:node_network_receive_bytes_total:counter}} IS NOT NULL
        | STATS Received = SUM(RATE({{metric:node_network_receive_bytes_total:counter}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend), {{label:device}}
        | KEEP time_bucket, `labels.device`, Received
        | SORT time_bucket ASC
      status_override: migrated
    - title_match: "Network Transmitted"
      kibana_type_override: line
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (?server == "" OR ({{label:instance}} RLIKE ?server OR ({{label:instance}} IS NULL AND "" RLIKE ?server)))
        | WHERE (NOT ({{label:device}} RLIKE "lo") OR ({{label:device}} IS NULL AND NOT ("" RLIKE "lo")))
        | WHERE {{metric:node_network_transmit_bytes_total:counter}} IS NOT NULL
        | STATS Transmitted = SUM(RATE({{metric:node_network_transmit_bytes_total:counter}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend), {{label:device}}
        | KEEP time_bucket, `labels.device`, Transmitted
        | SORT time_bucket ASC
      status_override: migrated

  layout_overrides:
    - title_match: "Idle CPU"
      title: "CPU Busy"
      hide_title: false
    - title_match: "System Load"
      hide_title: false
    - title_match: "Disk Space Usage"
      hide_title: false
    - title_match: "Network Received"
      size: {w: 24}
    - title_match: "Network Transmitted"
      size: {w: 24}

    - title_match: "Disk(s) io/s"
      panel_id: 58
      approximation_note: "The source applies rate() to node_disk_io_now, a gauge of in-progress I/O. ES|QL cannot rate a gauge, so the chart shows the last in-progress count by device. The rate window follows the dashboard time range. The resolution variable is a scrape step, not a Kibana control."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (?cluster == "" OR ({{label:cluster}} RLIKE ?cluster OR ({{label:cluster}} IS NULL AND "" RLIKE ?cluster)))
        | WHERE (?instance == "" OR ({{label:instance}} RLIKE ?instance OR ({{label:instance}} IS NULL AND "" RLIKE ?instance)))
        | WHERE {{metric:node_disk_io_now:gauge}} IS NOT NULL
        | STATS io = AVG(LAST_OVER_TIME({{metric:node_disk_io_now:gauge}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:device}}
        | EVAL device = {{label:device}}
        | STATS io = AVG(io) BY time_bucket, device

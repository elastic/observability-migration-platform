        | WHERE {{metric:node_disk_writes_completed_total:counter}} IS NOT NULL
        | STATS writes = AVG(RATE({{metric:node_disk_writes_completed_total:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:device}}

        | WHERE (?instance == "" OR ({{label:instance}} RLIKE ?instance OR ({{label:instance}} IS NULL AND "" RLIKE ?instance)))
        | WHERE {{metric:node_disk_read_bytes_total:counter}} IS NOT NULL
        | STATS bytes = AVG(RATE({{metric:node_disk_read_bytes_total:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:device}}
        | EVAL device = {{label:device}}

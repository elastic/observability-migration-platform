#
# Fidelity manifest — Grafana 12006 Kubernetes apiserver (revision 1).

schema_version: 1
gnet_id: 12006
gnet_revision: 1
dashboard_title: "Kubernetes apiserver"
maintainer: "community"

panels:
  - title: "apiserver request rate"
    panel_id: 8
    fidelity: APPROXIMATE
    notes: "Requests per second by verb. The 5m rate window follows the dashboard time range."
  - title: "workqueue service time"
    panel_id: 10
    fidelity: APPROXIMATE
    notes: "p95, p90, and p50 of workqueue queue duration from workqueue_queue_duration_seconds_bucket. client-go buckets are 1e-8s through 10s, times ten. The point is the bucket upper bound, not an interpolated histogram_quantile. The cumulative ratio is rounded to 6 decimals so a bucket that lands on the quantile stays selected."
  - title: "apiserver request latency"
    panel_id: 2
    fidelity: APPROXIMATE
    notes: "p95, p90, and p50 of request duration from apiserver_request_duration_seconds_bucket. CONNECT and WATCH are excluded. The point is the kube-apiserver bucket upper bound (0.005s through 60s), the same sum(rate()) by le reduction as histogram_quantile, without in-bucket interpolation. The cumulative ratio is rounded to 6 decimals so a bucket that lands on the quantile stays selected."
  - title: "workqueue processing time"
    panel_id: 12
    fidelity: APPROXIMATE
    notes: "p95, p90, and p50 of workqueue processing duration from workqueue_work_duration_seconds_bucket. The point is the bucket upper bound. The cumulative ratio is rounded to 6 decimals so a bucket that lands on the quantile stays selected."
  - title: "etcd request latency"
    panel_id: 4
    fidelity: APPROXIMATE
    notes: "p95, p90, and p50 of etcd request duration from etcd_request_duration_seconds_bucket. Buckets match kube-apiserver request latency. The point is the bucket upper bound. The cumulative ratio is rounded to 6 decimals so a bucket that lands on the quantile stays selected."
  - title: "etcd helper cache hit ratio"
    panel_id: 6
    fidelity: APPROXIMATE
    notes: "Cache hits divided by hits plus misses. The ratio stays 0-1, matching the source axis."

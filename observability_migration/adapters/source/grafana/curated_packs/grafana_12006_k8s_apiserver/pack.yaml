    - title_match: "etcd helper cache hit ratio"
      panel_id: 6
      kibana_type_override: line
      approximation_note: "Cache hits divided by hits plus misses. The ratio stays 0-1, matching the source axis."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{metric:etcd_helper_cache_hit_total:counter}} IS NOT NULL OR {{metric:etcd_helper_cache_miss_total:counter}} IS NOT NULL
        | STATS hits = SUM(RATE({{metric:etcd_helper_cache_hit_total:counter}})), misses = SUM(RATE({{metric:etcd_helper_cache_miss_total:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | EVAL ratio = CASE(hits + misses > 0, hits / (hits + misses), NULL)
        | KEEP time_bucket, ratio
        | SORT time_bucket ASC


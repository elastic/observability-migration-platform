#
# Curated pack — Grafana dashboard 12006
# https://grafana.com/grafana/dashboards/12006-kubernetes-apiserver/
#
# Kubernetes apiserver (revision 1). Latency charts name p95, p90, and p50.
# kube-apiserver exposes classic histograms (*_bucket counters with an le
# label), not a duration gauge. Each point is the upper bound of the bucket
# whose cumulative rate crosses the quantile. CONNECT and WATCH stay off the
# request-latency chart. The two bottom charts share one row.

query:
  metrics_dataset_filter: "prometheus"

  metric_kinds:
    apiserver_request_total: counter
    etcd_helper_cache_hit_total: counter
    etcd_helper_cache_miss_total: counter
    apiserver_request_duration_seconds_bucket: counter
    etcd_request_duration_seconds_bucket: counter
    workqueue_queue_duration_seconds_bucket: counter
    workqueue_work_duration_seconds_bucket: counter

  live_optional_metrics:
    - apiserver_request_total
    - apiserver_request_duration_seconds_bucket
    - workqueue_queue_duration_seconds_bucket
    - workqueue_work_duration_seconds_bucket
    - etcd_helper_cache_hit_total
    - etcd_helper_cache_miss_total
    - etcd_request_duration_seconds_bucket

panel:
  query_overrides:
    - title_match: "apiserver request rate"
      panel_id: 8
      kibana_type_override: line
      approximation_note: "Requests per second by verb. The 5m rate window follows the dashboard time range."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{metric:apiserver_request_total:counter}} IS NOT NULL
        | STATS requests = SUM(RATE({{metric:apiserver_request_total:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:verb}}
        | EVAL verb = {{label:verb}}
        | STATS requests = AVG(requests) BY time_bucket, verb
        | KEEP time_bucket, verb, requests
        | SORT time_bucket ASC
    - title_match: "workqueue service time"
      panel_id: 10
      kibana_type_override: line
      approximation_note: "p95, p90, and p50 of workqueue queue duration from workqueue_queue_duration_seconds_bucket. client-go buckets are 1e-8s through 10s, times ten. The point is the bucket upper bound, not an interpolated histogram_quantile. The cumulative ratio is rounded to 6 decimals so a bucket that lands on the quantile stays selected."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{metric:workqueue_queue_duration_seconds_bucket:counter}} IS NOT NULL
        | STATS b0 = SUM(CASE({{label:le}} == "0.00000001", RATE({{metric:workqueue_queue_duration_seconds_bucket:counter}}), NULL)), b1 = SUM(CASE({{label:le}} == "0.0000001", RATE({{metric:workqueue_queue_duration_seconds_bucket:counter}}), NULL)), b2 = SUM(CASE({{label:le}} == "0.000001", RATE({{metric:workqueue_queue_duration_seconds_bucket:counter}}), NULL)), b3 = SUM(CASE({{label:le}} == "0.00001", RATE({{metric:workqueue_queue_duration_seconds_bucket:counter}}), NULL)), b4 = SUM(CASE({{label:le}} == "0.0001", RATE({{metric:workqueue_queue_duration_seconds_bucket:counter}}), NULL)), b5 = SUM(CASE({{label:le}} == "0.001", RATE({{metric:workqueue_queue_duration_seconds_bucket:counter}}), NULL)), b6 = SUM(CASE({{label:le}} == "0.01", RATE({{metric:workqueue_queue_duration_seconds_bucket:counter}}), NULL)), b7 = SUM(CASE({{label:le}} == "0.1", RATE({{metric:workqueue_queue_duration_seconds_bucket:counter}}), NULL)), b8 = SUM(CASE({{label:le}} == "1", RATE({{metric:workqueue_queue_duration_seconds_bucket:counter}}), NULL)), b9 = SUM(CASE({{label:le}} == "10", RATE({{metric:workqueue_queue_duration_seconds_bucket:counter}}), NULL)), binf = SUM(CASE({{label:le}} == "+Inf", RATE({{metric:workqueue_queue_duration_seconds_bucket:counter}}), NULL)) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | EVAL total = binf
        | EVAL p95 = CASE(total > 0 AND ROUND(b0 / total, 6) >= 0.95, 0.00000001, total > 0 AND ROUND(b1 / total, 6) >= 0.95, 0.0000001, total > 0 AND ROUND(b2 / total, 6) >= 0.95, 0.000001, total > 0 AND ROUND(b3 / total, 6) >= 0.95, 0.00001, total > 0 AND ROUND(b4 / total, 6) >= 0.95, 0.0001, total > 0 AND ROUND(b5 / total, 6) >= 0.95, 0.001, total > 0 AND ROUND(b6 / total, 6) >= 0.95, 0.01, total > 0 AND ROUND(b7 / total, 6) >= 0.95, 0.1, total > 0 AND ROUND(b8 / total, 6) >= 0.95, 1, total > 0 AND ROUND(b9 / total, 6) >= 0.95, 10, total > 0, 10, NULL)
        | EVAL p90 = CASE(total > 0 AND ROUND(b0 / total, 6) >= 0.9, 0.00000001, total > 0 AND ROUND(b1 / total, 6) >= 0.9, 0.0000001, total > 0 AND ROUND(b2 / total, 6) >= 0.9, 0.000001, total > 0 AND ROUND(b3 / total, 6) >= 0.9, 0.00001, total > 0 AND ROUND(b4 / total, 6) >= 0.9, 0.0001, total > 0 AND ROUND(b5 / total, 6) >= 0.9, 0.001, total > 0 AND ROUND(b6 / total, 6) >= 0.9, 0.01, total > 0 AND ROUND(b7 / total, 6) >= 0.9, 0.1, total > 0 AND ROUND(b8 / total, 6) >= 0.9, 1, total > 0 AND ROUND(b9 / total, 6) >= 0.9, 10, total > 0, 10, NULL)
        | EVAL p50 = CASE(total > 0 AND ROUND(b0 / total, 6) >= 0.5, 0.00000001, total > 0 AND ROUND(b1 / total, 6) >= 0.5, 0.0000001, total > 0 AND ROUND(b2 / total, 6) >= 0.5, 0.000001, total > 0 AND ROUND(b3 / total, 6) >= 0.5, 0.00001, total > 0 AND ROUND(b4 / total, 6) >= 0.5, 0.0001, total > 0 AND ROUND(b5 / total, 6) >= 0.5, 0.001, total > 0 AND ROUND(b6 / total, 6) >= 0.5, 0.01, total > 0 AND ROUND(b7 / total, 6) >= 0.5, 0.1, total > 0 AND ROUND(b8 / total, 6) >= 0.5, 1, total > 0 AND ROUND(b9 / total, 6) >= 0.5, 10, total > 0, 10, NULL)
        | KEEP time_bucket, p95, p90, p50
        | SORT time_bucket ASC


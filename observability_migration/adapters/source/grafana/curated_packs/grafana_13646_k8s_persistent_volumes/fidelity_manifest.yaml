#
# Fidelity manifest — Grafana 13646 kubernetes-persistent-volumes (revision 2).

schema_version: 1
gnet_id: 13646
gnet_revision: 2
dashboard_title: "kubernetes-persistent-volumes"
maintainer: "community"

panels:
  - title: "PVCs Full in 2 days - Based on Daily Usage"
    panel_id: 22
    fidelity: APPROXIMATE
    notes: "predict_linear(available[1d], 2d) < 0 approximated as available / one-day used-byte growth under 2 days. The query reads the day before the range start, so growth is a full day whatever the dashboard time range. An empty result is 0 when no volume series are present only if other claims exist; a cluster with no volume metrics stays empty."
  - title: "PVCs Full in 5 days - Based on Daily Usage"
    panel_id: 28
    fidelity: APPROXIMATE
    notes: "Same one-day growth approximation as the 2-day tile, for a 5-day horizon."
  - title: "PVCs Full in 1 Week - Based on Daily Usage"
    panel_id: 27
    fidelity: APPROXIMATE
    notes: "Same one-day growth approximation as the 2-day tile, for a 7-day horizon."
  - title: "PVCs Above Warning Threshold"
    panel_id: 21
    fidelity: APPROXIMATE
    notes: "Count of claims at or above 80% used. Revision 2's textbox default is 80; the curated query replaces the textbox after it is inlined."
  - title: "PVCs in Pending State"
    panel_id: 24
    fidelity: APPROXIMATE
    notes: "Claims whose phase series is Pending. The source or vector(0) shows 0 when nothing matches; this sum is 0 when other claims exist and empty when the phase metric is absent."
  - title: "PVCs in Lost State"
    panel_id: 23
    fidelity: APPROXIMATE
    notes: "Claims whose phase series is Lost."
  - title: "Persistent Volume Claim"
    panel_id: 29
    fidelity: APPROXIMATE
    notes: "Capacity, used, and available in GiB, plus used percent and phase. The source numeric status (Pending=1, Lost=2) is the phase name. Storage class and volume name need the info series, which does not share the kubelet label set, so those columns are omitted."
  - title: "Storage Class"
    panel_id: 7
    fidelity: APPROXIMATE
    notes: "One row per storage class: provisioner, reclaim policy, and volume binding mode. The info gauge value is dropped, matching the source table."
  - title: "All Running PVCs Used Bytes"
    panel_id: 9
    fidelity: APPROXIMATE
    notes: "Used bytes per claim. The legend is namespace / claim."
  - title: "Hourly Volume Usage Rate"
    panel_id: 11
    fidelity: APPROXIMATE
    notes: "rate(used_bytes[1h]) on the used-bytes gauge, as DELTA over 1 hour divided by 3600, one series per claim."
  - title: "Daily Volume Usage Rate"
    panel_id: 12
    fidelity: APPROXIMATE
    notes: "rate(used_bytes[1d]) as DELTA over 24 hours divided by 86400, one series per claim. Points are hourly. The query reads the day before the range start so each point has a full daily lookback; buckets before the range are dropped."
  - title: "Weekly Volume Usage Rate"
    panel_id: 13
    fidelity: APPROXIMATE
    notes: "rate(used_bytes[1w]) as DELTA over 168 hours divided by 604800, one series per claim. The query reads the week before the range start so each daily point has a full weekly lookback; buckets before the range are dropped, so the line stays inside the dashboard time range."

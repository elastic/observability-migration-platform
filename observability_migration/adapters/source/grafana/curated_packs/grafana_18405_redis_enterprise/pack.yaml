#
# Curated pack — Grafana dashboard 18405
# https://grafana.com/grafana/dashboards/18405-redis-enterprise-cluster-status/
#
# Source: Redis Enterprise Prometheus endpoint (bdb_* metrics)
# Panels: 9 stat panels — 8 PERFECT, 1 APPROXIMATE (memory-usage ratio)
# Note: Redis Enterprise exports rate metrics (bdb_total_req) as Prometheus gauges
#       (already ops/sec); no rate() needed in PromQL or ES|QL.

query:
  metrics_dataset_filter: "prometheus"

  # --- counter / gauge classification -----------------------------------
  # All bdb_* metrics are Prometheus gauges from Redis Enterprise.
  # bdb_total_req is a pre-computed ops/sec rate; classify as gauge so
  # ES|QL translation reads the raw value without applying an extra rate.
  metric_kinds:
    bdb_up: gauge
    bdb_used_memory: gauge
    bdb_memory_limit: gauge
    bdb_total_req: gauge
    bdb_avg_latency: gauge
    bdb_expired_objects: gauge
    bdb_no_of_keys: gauge
    bdb_conns: gauge

  # --- label authoring ---------------------------------------------------
  # Redis Enterprise labels are authored with canonical names; the resolver
  # namespaces them per --field-profile (labels.*, prometheus.labels.*, or the
  # OTel spelling). ``cluster`` is a built-in canonical label, so it needs no
  # candidate entry. ``bdb`` is not a built-in canonical, so pin its OTel
  # spelling (``db.name``) — never a ``labels.*`` layout — for the otel profile.
  label_candidates:
    bdb:
      - db.name            # OTel ECS mode; native/prometheus profiles namespace canonically

panel:
  query_overrides:
    # Memory Usage (stat → metric): auto-translation marks this APPROXIMATE because
    # the binary expression (bdb_used_memory / bdb_memory_limit) has no outer
    # aggregation and no on() modifier. The hand-crafted query computes the ratio
    # directly in a single STATS clause — semantically exact.
    - title_match: "Memory Usage"
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | STATS value = MAX(LAST_OVER_TIME({{metric:bdb_used_memory:gauge}})) / MAX(LAST_OVER_TIME({{metric:bdb_memory_limit:gauge}}))
      status_override: migrated

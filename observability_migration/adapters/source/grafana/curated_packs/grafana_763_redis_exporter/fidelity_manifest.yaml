#
# Fidelity manifest — Grafana dashboard 763 (redis_exporter)
# https://grafana.com/grafana/dashboards/763-redis-dashboard-for-prometheus-redis-exporter-1-x/
#
# Layout: Grafana 24-col → Kibana 48-col (2× scale on x and w; h scaled for readability)
# Fidelity: PERFECT = 100% semantic parity | APPROXIMATE = documented delta

schema_version: 1
gnet_id: 763
gnet_revision: 6
dashboard_title: "Redis Dashboard for Prometheus Redis Exporter 1.x"

panels:
  - id: 9
    title: "Max Uptime"
    grafana_type: stat
    fidelity: PERFECT
    notes: "max_over_time over $__interval is rewritten to max() gauge agg"
    grafana_grid: {x: 0, y: 0, w: 3, h: 7}
    kibana_grid: {x: 0, y: 0, w: 8, h: 6}

  - id: 12
    title: "Clients"
    grafana_type: stat
    fidelity: PERFECT
    notes: ""
    grafana_grid: {x: 3, y: 0, w: 2, h: 7}
    kibana_grid: {x: 8, y: 0, w: 8, h: 6}

  - id: 11
    title: "Memory Usage"
    grafana_type: gauge
    fidelity: APPROXIMATE
    notes: >
      Ratio formula (used / max * 100). Native PromQL preserves exact semantics.
      ES|QL fallback emits the ratio as two separate stats; no single-panel percent gauge.
    grafana_grid: {x: 5, y: 0, w: 3, h: 7}
    kibana_grid: {x: 16, y: 0, w: 10, h: 6}

  - id: 18
    title: "Total Commands/sec"
    grafana_type: timeseries
    fidelity: PERFECT
    notes: "rate(redis_commands_total[1m]) by (cmd) — straightforward counter rate"
    grafana_grid: {x: 8, y: 0, w: 8, h: 7}
    kibana_grid: {x: 26, y: 0, w: 14, h: 6}

  - id: 1
    title: "Hits / Misses per Sec"
    grafana_type: timeseries
    fidelity: PERFECT
    notes: "irate of keyspace_hits + keyspace_misses — two counter series"
    grafana_grid: {x: 16, y: 0, w: 8, h: 7}
    kibana_grid: {x: 0, y: 6, w: 16, h: 8}

  - id: 7
    title: "Total Memory Usage"
    grafana_type: timeseries
    fidelity: PERFECT
    notes: "used_bytes and max_bytes as gauge series"
    grafana_grid: {x: 0, y: 7, w: 12, h: 7}
    kibana_grid: {x: 16, y: 6, w: 16, h: 8}

  - id: 10
    title: "Network I/O"
    grafana_type: timeseries
    fidelity: PERFECT
    notes: "rate of net_input_bytes_total and net_output_bytes_total"
    grafana_grid: {x: 12, y: 7, w: 12, h: 7}
    kibana_grid: {x: 32, y: 6, w: 16, h: 8}

  - id: 5
    title: "Total Items per DB"
    grafana_type: timeseries
    fidelity: PERFECT
    notes: "redis_db_keys gauge grouped by db and instance"
    grafana_grid: {x: 0, y: 14, w: 12, h: 7}
    kibana_grid: {x: 0, y: 14, w: 16, h: 8}

  - id: 13
    title: "Expiring vs Not-Expiring Keys"
    grafana_type: timeseries
    fidelity: APPROXIMATE
    notes: >
      Subtraction formula (db_keys - db_keys_expiring). Native PromQL is exact.
      ES|QL fallback emits each series separately; subtraction is not supported inline.
    grafana_grid: {x: 12, y: 14, w: 12, h: 7}
    kibana_grid: {x: 16, y: 14, w: 16, h: 8}

  - id: 8
    title: "Expired / Evicted Keys"
    grafana_type: timeseries
    fidelity: PERFECT
    notes: "rate of expired_keys_total and evicted_keys_total grouped by instance"
    grafana_grid: {x: 0, y: 21, w: 12, h: 7}
    kibana_grid: {x: 32, y: 14, w: 16, h: 8}

  - id: 16
    title: "Connected / Blocked Clients"
    grafana_type: timeseries
    fidelity: PERFECT
    notes: "connected_clients and blocked_clients gauge series"
    grafana_grid: {x: 12, y: 21, w: 12, h: 7}
    kibana_grid: {x: 0, y: 22, w: 16, h: 8}

  - id: 20
    title: "Avg Time Spent by Command"
    grafana_type: timeseries
    fidelity: APPROXIMATE
    notes: >
      Division formula (duration_total / commands_total) by cmd. Native PromQL is exact.
      ES|QL fallback emits denominator/numerator separately — average latency per command
      cannot be reconstructed without per-bucket division.
    grafana_grid: {x: 0, y: 28, w: 12, h: 7}
    kibana_grid: {x: 16, y: 22, w: 16, h: 8}

  - id: 14
    title: "Total Time Spent by Command"
    grafana_type: timeseries
    fidelity: PERFECT
    notes: "irate of redis_commands_duration_seconds_total by cmd"
    grafana_grid: {x: 12, y: 28, w: 12, h: 7}
    kibana_grid: {x: 32, y: 22, w: 16, h: 8}

variables:
  - name: namespace
    type: query
    fidelity: PERFECT
    notes: >
      label_values(redis_up, namespace) — translates to keyword terms aggregation.
      Live-validated: "default" option found from `namespace` top-level field (OTEL ECS mode).

  - name: instance
    type: query
    fidelity: PERFECT
    notes: >
      label_values(redis_up{namespace=~'$namespace'}, instance) — filtered terms agg.
      Live-validated on Elastic Cloud (prometheus_native profile): PERFECT — resolver uses
      `labels.instance` directly. Local OTEL ECS rig: empty (known gap — resolver built with
      base pack before curated candidates are merged; `service.node.name` not reached).
      Production path is unaffected. See plan Task 8 Discoveries for detail.

summary:
  total_panels: 13
  perfect: 10
  approximate: 3
  not_feasible: 0
  overall_fidelity: HIGH
  live_validation:
    date: "2026-07-29"
    environment: "ES 9.5.0 + OTEL Collector (ECS mode) + Kibana 9.5.0"
    panels_render_error: 13
    panels_render_error_cause: >
      `TS` ES|QL command not supported by ES 9.5.0 standard self-hosted build (infrastructure constraint).
      All panels use `TS` source due to assume_tsds_gauges=True default. On Elastic Cloud ESS
      (TSDB-enabled build) this constraint does not apply.
    namespace_control: PASS
    instance_control: FAIL_LOCAL_ONLY
    instance_control_note: >
      Schema resolver built before curated pack merge; `service.node.name` candidate not
      reached. Production (prometheus_native profile) is unaffected.
    ingestion_method: "OTEL Collector otel/opentelemetry-collector-contrib:0.106.0 (ECS mode)"
    data_stream: "metrics-redis.prometheus-default"

# Curated pack — Grafana dashboard 763
# https://grafana.com/grafana/dashboards/763-redis-dashboard-for-prometheus-redis-exporter-1-x/
#
# Source: oliver006/redis_exporter  (Prometheus scrape)
# Panels: 13 total — 11 PERFECT, 2 APPROXIMATE (memory% via plugin; Network I/O is 2-series but uses OR filter)
# Translation mode: auto (PromQL-first when native-PromQL is enabled; ES|QL fallback)

query:
  metrics_dataset_filter: "prometheus"

  # --- counter / gauge classification -----------------------------------
  # Counters: have rate()/irate() applied in the source PromQL expressions.
  # Gauges:   point-in-time readings used with sum()/max() directly.
  metric_kinds:
    redis_commands_total: counter
    redis_keyspace_hits_total: counter
    redis_keyspace_misses_total: counter
    redis_net_input_bytes_total: counter
    redis_net_output_bytes_total: counter
    redis_expired_keys_total: counter
    redis_evicted_keys_total: counter
    redis_commands_duration_seconds_total: counter
    redis_uptime_in_seconds: gauge
    redis_connected_clients: gauge
    redis_blocked_clients: gauge
    redis_memory_used_bytes: gauge
    redis_memory_max_bytes: gauge
    redis_db_keys: gauge
    redis_db_keys_expiring: gauge

  # --- Prometheus label → OTel/Elastic field candidates -----------------
  # Listed in resolution priority order (first match wins).
  # prometheus_native layout (default for redis_exporter scrapes) stores all
  # Prometheus labels under labels.<name>.  Those candidates are listed first
  # so offline migrations produce the correct field name without needing a
  # live ES field-caps probe.  In live mode the source-faithful shortcut in
  # SchemaResolver already returns labels.<name> for prometheus_native indices,
  # so these candidates only matter for the offline fallback path.
  label_candidates:
    instance:
      - labels.instance     # prometheus_native (primary for redis_exporter)
      - service.instance.id # OTel ECS mode
      - service.node.name   # OTel ECS mode: prometheus `instance` label -> service.node.name
      - host.name
    job:
      - labels.job          # prometheus_native
      - service.name        # OTel ECS mode
    namespace:
      - labels.namespace    # prometheus_native
      - service.namespace   # OTel ECS mode
      - namespace           # OTel ECS mode: prometheus `namespace` label stored as top-level field
    cmd:
      - labels.cmd
      - cmd                 # OTel ECS mode: stored as top-level field
    db:
      - labels.db
      - db

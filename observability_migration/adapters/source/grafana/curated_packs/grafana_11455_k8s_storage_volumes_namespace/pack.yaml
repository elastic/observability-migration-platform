#
# Curated pack — Grafana dashboard 11455
# https://grafana.com/grafana/dashboards/11455-k8s-storage-volumes-namespace/
#
# Namespace volume dashboard (revision 6). Same approximations as the cluster
# volume pack (11454): predict_linear fill-in-a-week is available bytes over
# one day of used-byte growth, the 80 textbox default is the warning threshold,
# and OpenShift pv_collector counts are kube_persistentvolumeclaim_status_phase.
# The namespace control is an exact match. Empty or the ".*" all option matches
# every namespace (an upload with Elasticsearch access opens on the first
# namespace instead, as Grafana does with no saved value); per-claim
# series then keep the namespace so same-named claims stay apart. The "current"
# table is the exception: the source query lists infrastructure namespaces and
# a week of growth, and it does not use $namespace. The hidden
# $persistentvolumeclaim variable only drives the Grafana repeat, so no query
# binds it and no claim control is emitted.

query:
  metrics_dataset_filter: "prometheus"

  metric_kinds:
    kubelet_volume_stats_available_bytes: gauge
    kubelet_volume_stats_used_bytes: gauge
    kubelet_volume_stats_capacity_bytes: gauge
    kube_persistentvolumeclaim_info: gauge
    kube_persistentvolumeclaim_status_phase: gauge
    kube_namespace_created: gauge

  live_optional_metrics:
    - kubelet_volume_stats_available_bytes
    - kubelet_volume_stats_used_bytes
    - kubelet_volume_stats_capacity_bytes
    - kube_persistentvolumeclaim_info
    - kube_persistentvolumeclaim_status_phase
    - kube_namespace_created

panel:
  query_overrides:
    - title_match: "Volumes Full in Week Based on Daily Use Rate"
      panel_id: 59
      kibana_type_override: metric
      approximation_note: "predict_linear(available[1d], 7d) < 0 approximated as available / one-day used-byte growth under 7 days, for the selected namespace."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_available_bytes:gauge}} IS NOT NULL OR {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL
        | STATS available = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_available_bytes:gauge}})), growth = MAX(DELTA({{metric:kubelet_volume_stats_used_bytes:gauge}}, 24 hours)) BY bucket = TBUCKET(1 hour), {{label:namespace}}, {{label:persistentvolumeclaim}}
        | WHERE bucket >= ?_tend - 2 hours
        | STATS available = MIN(available), growth = MAX(growth) BY {{label:namespace}}, {{label:persistentvolumeclaim}}
        | EVAL at_risk = CASE(growth > 0 AND available / growth < 7, 1, 0)
        | STATS volumes = SUM(at_risk)
        | KEEP volumes
    - title_match: "Running PVCs Above % Used Warning Threshold"
      panel_id: 10
      kibana_type_override: metric
      approximation_note: "Count of PVCs in the selected namespace at or above 80% used. Revision 6's textbox default is 80."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL OR {{metric:kubelet_volume_stats_capacity_bytes:gauge}} IS NOT NULL
        | STATS used = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_used_bytes:gauge}})), capacity = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_capacity_bytes:gauge}})) BY {{label:namespace}}, {{label:persistentvolumeclaim}}
        | EVAL hot = CASE(capacity > 0 AND used / capacity >= 0.8, 1, 0)
        | STATS volumes = SUM(hot)
        | KEEP volumes
    - title_match: "Unbound PVCs"
      panel_id: 6
      kibana_type_override: metric
      approximation_note: "OpenShift pv_collector_unbound_pvc_count replaced with kube_persistentvolumeclaim_status_phase where phase is not Bound, in the selected namespace."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{label:phase}} != "Bound"
        | WHERE {{metric:kube_persistentvolumeclaim_status_phase:gauge}} IS NOT NULL
        | STATS volumes = SUM(LAST_OVER_TIME({{metric:kube_persistentvolumeclaim_status_phase:gauge}}))
        | KEEP volumes
    - title_match: "Volumes Full in Week Based on Daily Use Rate - Current"
      panel_id: 63
      kibana_type_override: datatable
      approximation_note: "predict_linear(available[1w], 7d) < 0. A week of used-byte growth is scaled to a daily rate. The source query lists infrastructure namespaces and does not use the namespace control."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tend - 168 hours AND @timestamp <= ?_tend
        | WHERE {{label:namespace}} RLIKE "(openshift-.*|kube-.*|default|logging)"
        | WHERE {{metric:kubelet_volume_stats_available_bytes:gauge}} IS NOT NULL OR {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL
        | STATS available = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_available_bytes:gauge}})), growth = MAX(DELTA({{metric:kubelet_volume_stats_used_bytes:gauge}}, 168 hours)) BY bucket = TBUCKET(1 hour), {{label:namespace}}, {{label:persistentvolumeclaim}}
        | WHERE bucket >= ?_tend - 2 hours
        | STATS available = MIN(available), growth = MAX(growth) BY {{label:namespace}}, {{label:persistentvolumeclaim}}
        | EVAL days_left = CASE(growth > 0, available / growth * 7, NULL)
        | WHERE days_left < 7
        | EVAL namespace = {{label:namespace}}, claim = {{label:persistentvolumeclaim}}
        | STATS days_left = MIN(days_left), available = MAX(available) BY namespace, claim
        | KEEP namespace, claim, days_left, available
        | SORT days_left ASC
    - title_match: "Volumes Full in Week Based on Daily Use Rate - Alert History"
      panel_id: 61
      kibana_type_override: line
      approximation_note: "Count of volumes in the selected namespace predicted full within a week, instead of a 0/1 spike per claim."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_available_bytes:gauge}} IS NOT NULL OR {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL
        | STATS available = AVG(LAST_OVER_TIME({{metric:kubelet_volume_stats_available_bytes:gauge}})), growth = MAX(DELTA({{metric:kubelet_volume_stats_used_bytes:gauge}}, 24 hours)) BY time_bucket = TBUCKET(1 hour), {{label:namespace}}, {{label:persistentvolumeclaim}}
        | EVAL at_risk = CASE(growth > 0 AND available / growth < 7, 1, 0)
        | STATS volumes = SUM(at_risk) BY time_bucket
        | KEEP time_bucket, volumes
        | SORT time_bucket ASC
    - title_match: "Volumes Full in Week Based on Daily Use Rate -  Predicted Available Space History"
      panel_id: 78
      kibana_type_override: line
      approximation_note: "Projected bytes left after 7 days of the current one-day growth, for volumes in the selected namespace already predicted to go negative. Series are labelled namespace (claim)."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_available_bytes:gauge}} IS NOT NULL OR {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL
        | STATS available = AVG(LAST_OVER_TIME({{metric:kubelet_volume_stats_available_bytes:gauge}})), growth = MAX(DELTA({{metric:kubelet_volume_stats_used_bytes:gauge}}, 24 hours)) BY time_bucket = TBUCKET(1 hour), {{label:namespace}}, {{label:persistentvolumeclaim}}
        | EVAL projected_bytes = available - growth * 7
        | WHERE projected_bytes < 0
        | EVAL legend = CONCAT(TO_STRING({{label:namespace}}), " (", TO_STRING({{label:persistentvolumeclaim}}), ")")
        | STATS projected_bytes = AVG(projected_bytes) BY time_bucket, legend
        | KEEP time_bucket, legend, projected_bytes
        | SORT time_bucket ASC
    - title_match: "Running PVCs Above % Used Warning Threshold Stats - Current"
      panel_id: 12
      kibana_type_override: datatable
      approximation_note: "Claims in the selected namespace at or above 80% used, with used, capacity, free, and the 0-1 ratio. The info-metric existence target is dropped."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL OR {{metric:kubelet_volume_stats_capacity_bytes:gauge}} IS NOT NULL
        | STATS used = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_used_bytes:gauge}})), capacity = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_capacity_bytes:gauge}})), free = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_available_bytes:gauge}})) BY {{label:namespace}}, {{label:persistentvolumeclaim}}
        | EVAL percent_used = CASE(capacity > 0, used / capacity, NULL)
        | WHERE percent_used >= 0.8
        | EVAL namespace = {{label:namespace}}, claim = {{label:persistentvolumeclaim}}
        | STATS percent_used = MAX(percent_used), used = MAX(used), capacity = MAX(capacity), free = MAX(free) BY namespace, claim
        | KEEP namespace, claim, percent_used, used, capacity, free
        | SORT percent_used DESC
    - title_match: "Running PVCs Above % Used Warning Threshold"
      panel_id: 65
      kibana_type_override: line
      approximation_note: "Count of claims in the selected namespace at or above 80% used over time, instead of a 0/1 series per claim."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL OR {{metric:kubelet_volume_stats_capacity_bytes:gauge}} IS NOT NULL
        | STATS used = AVG(LAST_OVER_TIME({{metric:kubelet_volume_stats_used_bytes:gauge}})), capacity = AVG(LAST_OVER_TIME({{metric:kubelet_volume_stats_capacity_bytes:gauge}})) BY time_bucket = TBUCKET(1 hour), {{label:namespace}}, {{label:persistentvolumeclaim}}
        | EVAL hot = CASE(capacity > 0 AND used / capacity >= 0.8, 1, 0)
        | STATS volumes = SUM(hot) BY time_bucket
        | KEEP time_bucket, volumes
        | SORT time_bucket ASC
    - title_match: "Bound PVCs"
      panel_id: 4
      kibana_type_override: metric
      approximation_note: "OpenShift pv_collector_bound_pvc_count replaced with kube_persistentvolumeclaim_status_phase where phase is Bound, in the selected namespace."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{label:phase}} == "Bound"
        | WHERE {{metric:kube_persistentvolumeclaim_status_phase:gauge}} IS NOT NULL
        | STATS volumes = SUM(LAST_OVER_TIME({{metric:kube_persistentvolumeclaim_status_phase:gauge}}))
        | KEEP volumes
    - title_match: "PVC Stats"
      panel_id: 8
      kibana_type_override: datatable
      approximation_note: "Used, capacity, free, and the 0-1 ratio per claim in the selected namespace. Claims with kube_persistentvolumeclaim_info but no kubelet stats (pending or unmounted) are listed with empty values, like the source info rows."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL OR {{metric:kubelet_volume_stats_capacity_bytes:gauge}} IS NOT NULL OR {{metric:kubelet_volume_stats_available_bytes:gauge}} IS NOT NULL OR {{metric:kube_persistentvolumeclaim_info:gauge}} IS NOT NULL
        | STATS used = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_used_bytes:gauge}})), capacity = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_capacity_bytes:gauge}})), free = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_available_bytes:gauge}})), info = MAX(LAST_OVER_TIME({{metric:kube_persistentvolumeclaim_info:gauge}})) BY {{label:namespace}}, {{label:persistentvolumeclaim}}
        | WHERE info IS NOT NULL OR used IS NOT NULL OR capacity IS NOT NULL OR free IS NOT NULL
        | EVAL percent_used = CASE(capacity > 0, used / capacity, NULL)
        | EVAL namespace = {{label:namespace}}, claim = {{label:persistentvolumeclaim}}
        | KEEP namespace, claim, percent_used, used, capacity, free
        | SORT percent_used DESC NULLS LAST
    - title_match: "Running PVCs % Used"
      panel_id: 16
      kibana_type_override: line
      approximation_note: "Same-bucket used/capacity percent by claim in the selected namespace, labelled namespace (claim). The source multiplies by 100."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL OR {{metric:kubelet_volume_stats_capacity_bytes:gauge}} IS NOT NULL
        | STATS used = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_used_bytes:gauge}})), capacity = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_capacity_bytes:gauge}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:namespace}}, {{label:persistentvolumeclaim}}
        | EVAL legend = CONCAT(TO_STRING({{label:namespace}}), " (", TO_STRING({{label:persistentvolumeclaim}}), ")")
        | EVAL percent = CASE(capacity > 0, used / capacity * 100, NULL)
        | STATS percent = AVG(percent) BY time_bucket, legend
        | KEEP time_bucket, legend, percent
        | SORT time_bucket ASC
    - title_match: "All Running PVCs Used Bytes"
      panel_id: 19
      kibana_type_override: line
      approximation_note: "max by (persistentvolumeclaim, namespace) per step becomes the last used-bytes value per time bucket, one series per namespace (claim)."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL
        | STATS used = MAX(LAST_OVER_TIME({{metric:kubelet_volume_stats_used_bytes:gauge}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:namespace}}, {{label:persistentvolumeclaim}}
        | EVAL legend = CONCAT(TO_STRING({{label:namespace}}), " (", TO_STRING({{label:persistentvolumeclaim}}), ")")
        | STATS used_bytes = AVG(used) BY time_bucket, legend
        | KEEP time_bucket, legend, used_bytes
        | SORT time_bucket ASC
    - title_match: "$persistentvolumeclaim"
      kibana_type_override: line
      approximation_note: "Grafana repeats one used-and-capacity chart per claim from the hidden $persistentvolumeclaim variable. Kibana has no panel repeat, so one chart plots used and capacity for every claim in the selected namespace, labelled namespace (claim)."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL OR {{metric:kubelet_volume_stats_capacity_bytes:gauge}} IS NOT NULL
        | STATS used = AVG(LAST_OVER_TIME({{metric:kubelet_volume_stats_used_bytes:gauge}})), capacity = AVG(LAST_OVER_TIME({{metric:kubelet_volume_stats_capacity_bytes:gauge}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:namespace}}, {{label:persistentvolumeclaim}}
        | EVAL claim = CONCAT(TO_STRING({{label:namespace}}), " (", TO_STRING({{label:persistentvolumeclaim}}), ")")
        | EVAL __labels = MV_APPEND("Used", "Capacity")
        | EVAL __values = MV_APPEND(COALESCE(TO_STRING(used), ""), COALESCE(TO_STRING(capacity), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "~")
        | MV_EXPAND __pairs
        | EVAL direction = MV_FIRST(SPLIT(__pairs, "~")), bytes = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "~")))
        | EVAL legend = CONCAT(claim, " ", direction)
        | STATS bytes = AVG(bytes) BY time_bucket, legend
        | KEEP time_bucket, legend, bytes
        | SORT time_bucket ASC
    - title_match: "Hourly Volume Use Rate"
      panel_id: 43
      kibana_type_override: line
      approximation_note: "rate(used_bytes[1h]) on the used-bytes gauge, as DELTA over 1 hour divided by 3600, one series per claim in the selected namespace."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL
        | STATS growth = AVG(DELTA({{metric:kubelet_volume_stats_used_bytes:gauge}}, 1 hour)) BY time_bucket = TBUCKET(1 hour), {{label:namespace}}, {{label:persistentvolumeclaim}}
        | EVAL bytes_per_sec = growth / 3600
        | EVAL legend = CONCAT(TO_STRING({{label:namespace}}), " (", TO_STRING({{label:persistentvolumeclaim}}), ")")
        | STATS bytes_per_sec = AVG(bytes_per_sec) BY time_bucket, legend
        | KEEP time_bucket, legend, bytes_per_sec
        | SORT time_bucket ASC
    - title_match: "Daily Volume Use Rate"
      panel_id: 49
      kibana_type_override: line
      approximation_note: "rate(used_bytes[1d]) as a sliding DELTA over 24 hours divided by 86400, plotted hourly, one series per claim in the selected namespace. The query reads the day before the range start for the first points' lookback."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart - 24 hours AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL
        | STATS growth = AVG(DELTA({{metric:kubelet_volume_stats_used_bytes:gauge}}, 24 hours)) BY time_bucket = TBUCKET(1 hour), {{label:namespace}}, {{label:persistentvolumeclaim}}
        | WHERE time_bucket >= ?_tstart
        | EVAL bytes_per_sec = growth / 86400
        | EVAL legend = CONCAT(TO_STRING({{label:namespace}}), " (", TO_STRING({{label:persistentvolumeclaim}}), ")")
        | STATS bytes_per_sec = AVG(bytes_per_sec) BY time_bucket, legend
        | KEEP time_bucket, legend, bytes_per_sec
        | SORT time_bucket ASC
    - title_match: "Weekly Volume Use Rate"
      panel_id: 50
      kibana_type_override: line
      approximation_note: "rate(used_bytes[1w]) as DELTA over 168 hours divided by 604800, one series per claim in the selected namespace. Plotted hourly as a sliding weekly window. The query reads the week before the range start so each point has a full weekly lookback; buckets before the range are dropped."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart - 168 hours AND @timestamp <= ?_tend
        | WHERE ?namespace IS NULL OR ?namespace == "" OR ?namespace == ".*" OR {{label:namespace}} == ?namespace
        | WHERE {{metric:kubelet_volume_stats_used_bytes:gauge}} IS NOT NULL
        | STATS growth = AVG(DELTA({{metric:kubelet_volume_stats_used_bytes:gauge}}, 168 hours)) BY time_bucket = TBUCKET(1 hour), {{label:namespace}}, {{label:persistentvolumeclaim}}
        | WHERE time_bucket >= ?_tstart
        | EVAL bytes_per_sec = growth / 604800
        | EVAL legend = CONCAT(TO_STRING({{label:namespace}}), " (", TO_STRING({{label:persistentvolumeclaim}}), ")")
        | STATS bytes_per_sec = AVG(bytes_per_sec) BY time_bucket, legend
        | KEEP time_bucket, legend, bytes_per_sec
        | SORT time_bucket ASC

  layout_overrides:
    - title_match: "Current Alerts"
      collapsed: false
    - title_match: "Alert Details"
      collapsed: false
    - title_match: "Stats"
      collapsed: false
    - title_match: "Use"
      collapsed: false
    - title_match: "Use vs Capacity"
      collapsed: false
    - title_match: "Use Rate"
      collapsed: false
    - title_match: "Volumes Full in Week Based on Daily Use Rate"
      panel_id: 59
      hide_title: false
      size: {w: 48, h: 8}
      position: {x: 0, y: 0}
    - title_match: "Running PVCs Above % Used Warning Threshold"
      panel_id: 10
      title: "PVCs above 80% used"
      hide_title: false
      size: {w: 24, h: 8}
      position: {x: 0, y: 8}
    - title_match: "Unbound PVCs"
      panel_id: 6
      hide_title: false
      size: {w: 24, h: 8}
      position: {x: 24, y: 8}
    - title_match: "Volumes Full in Week Based on Daily Use Rate - Current"
      panel_id: 63
      title: "Infrastructure volumes filling this week"
      hide_title: false
      size: {w: 16, h: 16}
      position: {x: 0, y: 0}
    - title_match: "Volumes Full in Week Based on Daily Use Rate - Alert History"
      panel_id: 61
      title: "Volumes at risk"
      hide_title: false
      size: {w: 32, h: 14}
      position: {x: 16, y: 0}
    - title_match: "Volumes Full in Week Based on Daily Use Rate -  Predicted Available Space History"
      panel_id: 78
      title: "Projected bytes remaining"
      hide_title: false
      legend_position: right
      size: {w: 32, h: 14}
      position: {x: 16, y: 14}
    - title_match: "Running PVCs Above % Used Warning Threshold Stats - Current"
      panel_id: 12
      title: "Claims at or above 80%"
      hide_title: false
      size: {w: 16, h: 14}
      position: {x: 0, y: 16}
    - title_match: "Running PVCs Above % Used Warning Threshold"
      panel_id: 65
      title: "PVCs above 80% over time"
      hide_title: false
      size: {w: 32, h: 14}
      position: {x: 16, y: 28}
    - title_match: "Bound PVCs"
      panel_id: 4
      hide_title: false
      size: {w: 12, h: 8}
      position: {x: 0, y: 0}
    - title_match: "PVC Stats"
      panel_id: 8
      hide_title: false
      size: {w: 48, h: 16}
      position: {x: 0, y: 8}
    - title_match: "Running PVCs % Used"
      panel_id: 16
      hide_title: false
      legend_position: right
      size: {w: 48, h: 14}
      position: {x: 0, y: 0}
    - title_match: "All Running PVCs Used Bytes"
      panel_id: 19
      hide_title: false
      legend_position: right
      size: {w: 48, h: 14}
      position: {x: 0, y: 14}
    - title_match: "$persistentvolumeclaim"
      panel_id: 20
      title: "Used and capacity"
      hide_title: false
      legend_position: right
      size: {w: 48, h: 14}
      position: {x: 0, y: 0}
    - title_match: "Hourly Volume Use Rate"
      panel_id: 43
      hide_title: false
      legend_position: right
      size: {w: 48, h: 14}
      position: {x: 0, y: 0}
    - title_match: "Daily Volume Use Rate"
      panel_id: 49
      hide_title: false
      legend_position: right
      size: {w: 48, h: 14}
      position: {x: 0, y: 14}
    - title_match: "Weekly Volume Use Rate"
      panel_id: 50
      hide_title: false
      legend_position: right
      size: {w: 48, h: 14}
      position: {x: 0, y: 28}

# Curated pack — Grafana dashboard 1860
# https://grafana.com/grafana/dashboards/1860-node-exporter-full/
#
# Source: rfmoz/node-exporter-full
# Panels: 133 total
#
# This pack pins the suffix-less kernel/netstat counters that node_exporter
# exposes as ``untyped`` and repairs the "Processes Memory" panel for Kibana by
# treating the process-memory metrics as gauges and plotting their current
# values directly.

query:
  metrics_dataset_filter: "prometheus"

  metric_kinds:
    node_netstat_Icmp_InErrors: counter
    node_netstat_Icmp_InMsgs: counter
    node_netstat_Icmp_OutMsgs: counter
    node_netstat_IpExt_InOctets: counter
    node_netstat_IpExt_OutOctets: counter
    node_netstat_Ip_Forwarding: counter
    node_netstat_TcpExt_ListenDrops: counter
    node_netstat_TcpExt_ListenOverflows: counter
    node_netstat_TcpExt_TCPRcvQDrop: counter
    node_netstat_TcpExt_SyncookiesFailed: counter
    node_netstat_TcpExt_SyncookiesRecv: counter
    node_netstat_TcpExt_SyncookiesSent: counter
    node_netstat_TcpExt_TCPOFOQueue: counter
    node_netstat_TcpExt_TCPSynRetrans: counter
    node_netstat_Tcp_ActiveOpens: counter
    node_netstat_Tcp_InErrs: counter
    node_netstat_Tcp_InSegs: counter
    node_netstat_Tcp_OutRsts: counter
    node_netstat_Tcp_OutSegs: counter
    node_netstat_Tcp_PassiveOpens: counter
    node_netstat_Tcp_RetransSegs: counter
    node_netstat_UdpLite_InErrors: counter
    node_netstat_Udp_InDatagrams: counter
    node_netstat_Udp_InErrors: counter
    node_netstat_Udp_NoPorts: counter
    node_netstat_Udp_OutDatagrams: counter
    node_netstat_Udp_RcvbufErrors: counter
    node_netstat_Udp_SndbufErrors: counter
    node_vmstat_oom_kill: counter
    node_vmstat_pgfault: counter
    node_vmstat_pgmajfault: counter
    node_vmstat_pgpgin: counter
    node_vmstat_pgpgout: counter
    node_vmstat_pswpin: counter
    node_vmstat_pswpout: counter
    process_virtual_memory_bytes: gauge
    process_virtual_memory_max_bytes: gauge
    process_resident_memory_bytes: gauge
    node_cpu_scaling_frequency_hertz: gauge
    node_cpu_scaling_frequency_max_hertz: gauge
    node_cpu_scaling_frequency_min_hertz: gauge

  live_optional_metrics:
    - node_memory_HardwareCorrupted_bytes
    - node_netstat_TcpExt_TCPRcvQDrop
    - node_netstat_Tcp_MaxConn

  label_candidates:
    instance:
      - labels.instance
      - service.instance.id
      - host.name
    job:
      - labels.job
      - service.name

panel:
  query_overrides:
    - title_match: "CPU Busy"
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE labels.mode == "idle"
        | WHERE {{metric:node_cpu_seconds_total:counter}} IS NOT NULL
        | STATS idle_rate = AVG(IRATE({{metric:node_cpu_seconds_total:counter}})) BY time_bucket = TBUCKET(100, ?_tstart, ?_tend)
        | EVAL computed_value = (100 * (1 - idle_rate))
        | STATS computed_value = LAST(computed_value, time_bucket)
        | KEEP computed_value
        | EVAL _gauge_min = 0, _gauge_max = 100, _gauge_goal = 85
      status_override: migrated
    - title_match: "Pressure"
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE {{metric:node_pressure_cpu_waiting_seconds_total:counter}} IS NOT NULL OR {{metric:node_pressure_memory_waiting_seconds_total:counter}} IS NOT NULL OR {{metric:node_pressure_io_waiting_seconds_total:counter}} IS NOT NULL
        | STATS CPU = MAX(IRATE({{metric:node_pressure_cpu_waiting_seconds_total:counter}})), Mem = MAX(IRATE({{metric:node_pressure_memory_waiting_seconds_total:counter}})), IO = MAX(IRATE({{metric:node_pressure_io_waiting_seconds_total:counter}})) BY time_bucket = TBUCKET(100, ?_tstart, ?_tend)
        | STATS CPU = MAX(CPU), Mem = MAX(Mem), IO = MAX(IO)
        | KEEP CPU, IO, Mem
        | EVAL __labels = MV_APPEND(MV_APPEND("CPU", "I/O"), "Mem"), __values = MV_APPEND(MV_APPEND(COALESCE(TO_STRING(CPU), ""), COALESCE(TO_STRING(IO), "")), COALESCE(TO_STRING(Mem), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "~")
        | MV_EXPAND __pairs
        | EVAL label = MV_FIRST(SPLIT(__pairs, "~")), value = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "~")))
        | EVAL sort_order = CASE(label == "CPU", 0, label == "I/O", 1, 2)
        | SORT sort_order ASC
        | KEEP label, value
      status_override: migrated
    - title_match: "RAM Used"
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE {{metric:node_memory_MemAvailable_bytes:gauge}} IS NOT NULL OR {{metric:node_memory_MemTotal_bytes:gauge}} IS NOT NULL
        | STATS mem_available = MAX(LAST_OVER_TIME({{metric:node_memory_MemAvailable_bytes:gauge}})), mem_total = MAX(LAST_OVER_TIME({{metric:node_memory_MemTotal_bytes:gauge}})) BY time_bucket = TBUCKET(100, ?_tstart, ?_tend)
        | EVAL computed_value = CASE(mem_total > 0, ((1 - (mem_available / mem_total)) * 100), NULL)
        | STATS computed_value = LAST(computed_value, time_bucket)
        | KEEP computed_value
        | EVAL _gauge_min = 0, _gauge_max = 100, _gauge_goal = 80
      status_override: migrated
    - title_match: "SWAP Used"
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE {{metric:node_memory_SwapTotal_bytes:gauge}} IS NOT NULL OR {{metric:node_memory_SwapFree_bytes:gauge}} IS NOT NULL
        | STATS swap_total = MAX(LAST_OVER_TIME({{metric:node_memory_SwapTotal_bytes:gauge}})), swap_free = MAX(LAST_OVER_TIME({{metric:node_memory_SwapFree_bytes:gauge}})) BY time_bucket = TBUCKET(100, ?_tstart, ?_tend)
        | EVAL computed_value = CASE(swap_total > 0, (((swap_total - swap_free) / swap_total) * 100), NULL)
        | STATS computed_value = LAST(computed_value, time_bucket)
        | KEEP computed_value
        | EVAL _gauge_min = 0, _gauge_max = 100, _gauge_goal = 10
      status_override: migrated
    - title_match: "Uptime"
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE {{metric:node_time_seconds:gauge}} IS NOT NULL OR {{metric:node_boot_time_seconds:gauge}} IS NOT NULL
        | STATS node_time_seconds = MAX(LAST_OVER_TIME({{metric:node_time_seconds:gauge}})), node_boot_time_seconds = MAX(LAST_OVER_TIME({{metric:node_boot_time_seconds:gauge}})) BY time_bucket = TBUCKET(100, ?_tstart, ?_tend)
        | EVAL computed_value = node_time_seconds - node_boot_time_seconds
        | STATS computed_value = LAST(computed_value, time_bucket)
        | KEEP computed_value
      status_override: migrated
    - title_match: "Processes Memory"
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE {{metric:process_virtual_memory_bytes:gauge}} IS NOT NULL OR {{metric:process_resident_memory_bytes:gauge}} IS NOT NULL OR {{metric:process_virtual_memory_max_bytes:gauge}} IS NOT NULL
        | STATS Processes_virtual_memory_size_in_bytes = AVG(LAST_OVER_TIME({{metric:process_virtual_memory_bytes:gauge}})), Resident_memory_size_in_bytes = AVG(LAST_OVER_TIME({{metric:process_resident_memory_bytes:gauge}})), Maximum_amount_of_virtual_memory_available_in_bytes = AVG(LAST_OVER_TIME({{metric:process_virtual_memory_max_bytes:gauge}})) BY time_bucket = TBUCKET(100, ?_tstart, ?_tend), {{label:instance}}, {{label:job}}
        | EVAL series_group = CONCAT(COALESCE(TO_STRING(`{{label:instance}}`), ""), " / ", COALESCE(TO_STRING(`{{label:job}}`), ""))
        | SORT time_bucket ASC
      status_override: migrated
    - title_match: "Sys Load"
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE {{metric:node_load1:gauge}} IS NOT NULL OR {{metric:node_cpu_seconds_total:counter}} IS NOT NULL
        | STATS node_load1 = MAX(LAST_OVER_TIME({{metric:node_load1:gauge}})), cpu_cores = COUNT_DISTINCT(CASE({{metric:node_cpu_seconds_total:counter}} IS NOT NULL, labels.cpu, NULL)) BY time_bucket = TBUCKET(100, ?_tstart, ?_tend)
        | EVAL computed_value = CASE(cpu_cores > 0, ((node_load1 * 100) / cpu_cores), NULL)
        | STATS computed_value = LAST(computed_value, time_bucket)
        | KEEP computed_value
        | EVAL _gauge_min = 0, _gauge_max = 100, _gauge_goal = 85
      status_override: migrated
    - title_match: "Root FS Used"
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE (labels.mountpoint == "/" OR labels.mountpoint == "/oldroot")
        | WHERE (labels.fstype != "rootfs" OR (labels.fstype IS NULL AND "" != "rootfs"))
        | WHERE {{metric:node_filesystem_avail_bytes:gauge}} IS NOT NULL OR {{metric:node_filesystem_size_bytes:gauge}} IS NOT NULL
        | STATS avail = MAX(LAST_OVER_TIME({{metric:node_filesystem_avail_bytes:gauge}})), size = MAX(LAST_OVER_TIME({{metric:node_filesystem_size_bytes:gauge}})) BY time_bucket = TBUCKET(100, ?_tstart, ?_tend)
        | EVAL computed_value = CASE(size > 0, (100 - ((avail * 100) / size)), NULL)
        | STATS computed_value = LAST(computed_value, time_bucket)
        | KEEP computed_value
        | EVAL _gauge_min = 0, _gauge_max = 100, _gauge_goal = 80
      status_override: migrated
    - title_match: "RootFS Total"
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE (labels.mountpoint == "/" OR labels.mountpoint == "/oldroot")
        | WHERE (labels.fstype != "rootfs" OR (labels.fstype IS NULL AND "" != "rootfs"))
        | WHERE {{metric:node_filesystem_size_bytes:gauge}} IS NOT NULL
        | STATS node_filesystem_size_bytes = MAX(LAST_OVER_TIME({{metric:node_filesystem_size_bytes:gauge}})) BY time_bucket = TBUCKET(100, ?_tstart, ?_tend)
        | STATS node_filesystem_size_bytes = LAST(node_filesystem_size_bytes, time_bucket)
        | KEEP node_filesystem_size_bytes
      status_override: migrated
    - title_match: "CPU Cores"
      esql_query: |
        FROM metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE {{metric:node_cpu_seconds_total:counter}} IS NOT NULL
        | STATS cpu_cores = COUNT_DISTINCT(labels.cpu)
        | KEEP cpu_cores
      status_override: migrated
    - title_match: "TCP Errors"
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE {{metric:node_netstat_TcpExt_ListenOverflows:counter}} IS NOT NULL OR {{metric:node_netstat_TcpExt_ListenDrops:counter}} IS NOT NULL OR {{metric:node_netstat_TcpExt_TCPSynRetrans:counter}} IS NOT NULL OR {{metric:node_netstat_Tcp_RetransSegs:counter}} IS NOT NULL OR {{metric:node_netstat_Tcp_InErrs:counter}} IS NOT NULL OR {{metric:node_netstat_Tcp_OutRsts:counter}} IS NOT NULL OR {{metric:node_netstat_TcpExt_TCPOFOQueue:counter}} IS NOT NULL
        | STATS ListenOverflows_Times_the_listen_queue_of_a_socket_overflowed = AVG(IRATE({{metric:node_netstat_TcpExt_ListenOverflows:counter}})), ListenDrops_SYNs_to_LISTEN_sockets_ignored = AVG(IRATE({{metric:node_netstat_TcpExt_ListenDrops:counter}})), TCPSynRetrans_SYN_SYN_ACK_retransmits_to_break_down_retransmissions_in_SYN_fast_timeout_retransmits = AVG(IRATE({{metric:node_netstat_TcpExt_TCPSynRetrans:counter}})), RetransSegs_Segments_retransmitted_that_is_the_number_of_TCP_segments_transmitted_containing_one_or_more_previously_transmitted = AVG(IRATE({{metric:node_netstat_Tcp_RetransSegs:counter}})), InErrs_Segments_received_in_error_e_g_bad_TCP_checksums = AVG(IRATE({{metric:node_netstat_Tcp_InErrs:counter}})), OutRsts_Segments_sent_with_RST_flag = AVG(IRATE({{metric:node_netstat_Tcp_OutRsts:counter}})), TCPOFOQueue_TCP_layer_receives_an_out_of_order_packet_and_has_enough_memory_to_queue_it = AVG(IRATE({{metric:node_netstat_TcpExt_TCPOFOQueue:counter}})) BY time_bucket = TBUCKET(100, ?_tstart, ?_tend), {{label:instance}}, {{label:job}}
        | KEEP time_bucket, `{{label:instance}}`, `{{label:job}}`, ListenOverflows_Times_the_listen_queue_of_a_socket_overflowed, ListenDrops_SYNs_to_LISTEN_sockets_ignored, TCPSynRetrans_SYN_SYN_ACK_retransmits_to_break_down_retransmissions_in_SYN_fast_timeout_retransmits, RetransSegs_Segments_retransmitted_that_is_the_number_of_TCP_segments_transmitted_containing_one_or_more_previously_transmitted, InErrs_Segments_received_in_error_e_g_bad_TCP_checksums, OutRsts_Segments_sent_with_RST_flag, TCPOFOQueue_TCP_layer_receives_an_out_of_order_packet_and_has_enough_memory_to_queue_it

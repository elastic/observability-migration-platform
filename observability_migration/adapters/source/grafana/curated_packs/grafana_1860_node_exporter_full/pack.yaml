        | WHERE {{metric:node_disk_io_time_seconds_total:counter}} IS NOT NULL
        | STATS utilization = AVG(IRATE({{metric:node_disk_io_time_seconds_total:counter}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend), {{label:device}}

        | WHERE {{metric:node_disk_io_time_weighted_seconds_total:counter}} IS NOT NULL
        | STATS value = AVG(IRATE({{metric:node_disk_io_time_weighted_seconds_total:counter}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend), {{label:device}}
        | EVAL series_group = COALESCE(TO_STRING(`{{label:device}}`), "")

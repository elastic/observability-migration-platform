        | STATS operational_state_up = MAX(LAST_OVER_TIME(CASE(({{label:operstate}} == "up") and ({{metric:node_network_up:gauge}} IS NOT NULL), {{metric:node_network_up:gauge}}, NULL))), physical_link_state = MAX(LAST_OVER_TIME(CASE(({{metric:node_network_carrier:gauge}} IS NOT NULL), {{metric:node_network_carrier:gauge}}, NULL))) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:device}}

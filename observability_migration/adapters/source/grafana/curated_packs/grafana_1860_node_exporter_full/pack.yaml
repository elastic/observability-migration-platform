    - title_match: "Disk Space Used"
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE (NOT ({{label:device}} RLIKE "rootfs") OR ({{label:device}} IS NULL AND NOT ("" RLIKE "rootfs")))
        | WHERE {{metric:node_filesystem_size_bytes:gauge}} IS NOT NULL OR {{metric:node_filesystem_avail_bytes:gauge}} IS NOT NULL
        | STATS size_bytes = AVG(LAST_OVER_TIME({{metric:node_filesystem_size_bytes:gauge}})), avail_bytes = AVG(LAST_OVER_TIME({{metric:node_filesystem_avail_bytes:gauge}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:mountpoint}}
        | EVAL used_bytes = (size_bytes - avail_bytes)
        | KEEP time_bucket, {{label:mountpoint}}, used_bytes
        | SORT time_bucket ASC
      status_override: migrated
    - title_match: "Disk Space Used Basic"
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE (NOT ({{label:device}} RLIKE "rootfs") OR ({{label:device}} IS NULL AND NOT ("" RLIKE "rootfs")))
        | WHERE {{metric:node_filesystem_avail_bytes:gauge}} IS NOT NULL OR {{metric:node_filesystem_size_bytes:gauge}} IS NOT NULL
        | STATS node_filesystem_avail_bytes_device_rootfs = AVG(LAST_OVER_TIME({{metric:node_filesystem_avail_bytes:gauge}})), node_filesystem_size_bytes_device_rootfs = AVG(LAST_OVER_TIME({{metric:node_filesystem_size_bytes:gauge}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:mountpoint}}
        | EVAL value = (100 - ((node_filesystem_avail_bytes_device_rootfs * 100) / node_filesystem_size_bytes_device_rootfs))
        | EVAL series_group = COALESCE(TO_STRING(`{{label:mountpoint}}`), "")
        | KEEP time_bucket, series_group, value
        | SORT time_bucket ASC
      status_override: migrated
    - title_match: "CPU Frequency Scaling"
      # Grafana draws one series per cpu (`CPU {{ cpu }}`) plus single Max/Min
      # reference lines. Averaging hertz across CPUs collapsed that into one
      # "CPU" series; keep BY {{label:cpu}} and emit Max/Min only once (cpu=="0").
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE {{metric:node_cpu_scaling_frequency_hertz:gauge}} IS NOT NULL OR {{metric:node_cpu_scaling_frequency_max_hertz:gauge}} IS NOT NULL OR {{metric:node_cpu_scaling_frequency_min_hertz:gauge}} IS NOT NULL
        | STATS CPU = AVG(LAST_OVER_TIME({{metric:node_cpu_scaling_frequency_hertz:gauge}})), Max = AVG(LAST_OVER_TIME({{metric:node_cpu_scaling_frequency_max_hertz:gauge}})), Min = AVG(LAST_OVER_TIME({{metric:node_cpu_scaling_frequency_min_hertz:gauge}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:cpu}}
        | EVAL cpu_label = CONCAT("CPU ", COALESCE(TO_STRING({{label:cpu}}), ""))
        | EVAL __labels = CASE({{label:cpu}} == "0", MV_APPEND(MV_APPEND(cpu_label, "Max"), "Min"), cpu_label)
        | EVAL __values = CASE({{label:cpu}} == "0", MV_APPEND(MV_APPEND(COALESCE(TO_STRING(CPU), ""), COALESCE(TO_STRING(Max), "")), COALESCE(TO_STRING(Min), "")), COALESCE(TO_STRING(CPU), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "~")
        | MV_EXPAND __pairs
        | EVAL series_group = MV_FIRST(SPLIT(__pairs, "~")), value = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "~")))
        | KEEP time_bucket, series_group, value
        | SORT time_bucket ASC
      status_override: migrated
    - title_match: "Interrupts Detail"
      # Grafana legend is ``{{ type }} - {{ info }}``, but prometheus_native
      # ingest for this collector exposes ``{{label:interrupt}}`` (+ ``{{label:cpu}}``)
      # instead. The generic native-PROMQL path GROKs type/info from
      # ``_timeseries`` and collapses every series to legend ``" - "``. Prefer
      # TS IRATE grouped by the labels that actually exist.
      # TBUCKET(20) (~45s on 15m) keeps enough samples for IRATE; TBUCKET(100)
      # (~9s) is below scrape interval and blanks the chart while legends still
      # render from null series keys.
      esql_query: |
        TS metrics-*
        | WHERE (?node == "" OR ({{label:instance}} RLIKE ?node OR ({{label:instance}} IS NULL AND "" RLIKE ?node)))
        | WHERE (?job == "" OR ({{label:job}} RLIKE ?job OR ({{label:job}} IS NULL AND "" RLIKE ?job)))
        | WHERE {{metric:node_interrupts_total:counter}} IS NOT NULL
        | STATS value = AVG(IRATE({{metric:node_interrupts_total:counter}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend), {{label:interrupt}}, {{label:cpu}}
        | EVAL series_group = CONCAT(COALESCE(TO_STRING({{label:interrupt}}), ""), " - CPU ", COALESCE(TO_STRING({{label:cpu}}), ""))
        | KEEP time_bucket, series_group, value
        | SORT time_bucket ASC
      status_override: migrated

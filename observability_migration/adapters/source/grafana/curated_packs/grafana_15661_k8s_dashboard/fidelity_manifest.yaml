    grafana_type: timeseries
    kibana_type: line
    fidelity: APPROXIMATE
    delta: "Pod receive and transmit rates, max and sum, in bits per second, from every network series of the pod. The source keeps pods that have a kube_pod_container_info series matching the Container control; this keeps the same pods by grouping that series with the network series by pod. The sum series use that container match, not the source's pod-name substring, and the image and k8s_ name selectors are omitted."
    notes: "Pod receive and transmit rates, max and sum, in bits per second, from every network series of the pod. The source keeps pods that have a kube_pod_container_info series matching the Container control; this keeps the same pods by grouping that series with the network series by pod. The sum series use that container match, not the source's pod-name substring, and the image and k8s_ name selectors are omitted."

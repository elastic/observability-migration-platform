        | EVAL __values = MV_APPEND(MV_APPEND(MV_APPEND(COALESCE(TO_STRING(inflow), ""), COALESCE(TO_STRING(outflow), "")), COALESCE(TO_STRING(inbound), "")), COALESCE(TO_STRING(outbound), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "\t")
        | MV_EXPAND __pairs

    - title_match: "Microservice (Container Name) Network bandwidth per second (Associable Nodes)"
      panel_id: 16
      kibana_type_override: line
      approximation_note: "Inflow and outflow sum each pod's network rate onto every container that kube_pod_container_info lists in the pod, in bits per second, the same as the source join. The pod byte rate and its negative are per pod, filtered by the Pod control and by pod names that contain the Container value. The image and k8s_ name selectors are omitted."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend

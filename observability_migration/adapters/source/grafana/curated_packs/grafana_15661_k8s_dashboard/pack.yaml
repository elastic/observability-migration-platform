        | EVAL inflow = rx * 8, outflow = tx * 8, inbound = rx, outbound = 0 - tx
        | EVAL __labels = MV_APPEND(MV_APPEND(MV_APPEND(CONCAT("Inflow:", TO_STRING({{label:container}})), CONCAT("Outflow:", TO_STRING({{label:container}}))), CONCAT("-> ", TO_STRING({{label:pod}}))), CONCAT("<- ", TO_STRING({{label:pod}})))
        | EVAL __values = MV_APPEND(MV_APPEND(MV_APPEND(COALESCE(TO_STRING(inflow), ""), COALESCE(TO_STRING(outflow), "")), COALESCE(TO_STRING(inbound), "")), COALESCE(TO_STRING(outbound), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "\t")
        | MV_EXPAND __pairs
        | EVAL label = MV_FIRST(SPLIT(__pairs, "\t")), value = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "\t")))

        | STATS cpu = SUM(IRATE({{metric:container_cpu_usage_seconds_total:counter}})), quota = SUM(LAST_OVER_TIME({{metric:container_spec_cpu_quota:gauge}})), cpu_req = SUM(CASE({{label:resource}} == "cpu" AND {{label:unit}} == "core", LAST_OVER_TIME({{metric:kube_pod_container_resource_requests:gauge}}), NULL)), cpu_lim = SUM(CASE({{label:resource}} == "cpu" AND {{label:unit}} == "core", LAST_OVER_TIME({{metric:kube_pod_container_resource_limits:gauge}}), NULL)), wss = SUM(LAST_OVER_TIME({{metric:container_memory_working_set_bytes:gauge}})), rss = SUM(LAST_OVER_TIME({{metric:container_memory_rss:gauge}})), mem_limit = SUM(LAST_OVER_TIME({{metric:container_spec_memory_limit_bytes:gauge}})), mem_req = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_pod_container_resource_requests:gauge}}), NULL)), mem_lim = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_pod_container_resource_limits:gauge}}), NULL)), disk = AVG(LAST_OVER_TIME({{metric:container_fs_usage_bytes:gauge}})), disk_lim = AVG(LAST_OVER_TIME({{metric:container_fs_limit_bytes:gauge}})), pods = SUM(LAST_OVER_TIME({{metric:kube_pod_container_info:gauge}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:namespace}}, {{label:container}}
        | STATS cpu = LAST(cpu, time_bucket), quota = LAST(quota, time_bucket), cpu_req = LAST(cpu_req, time_bucket), cpu_lim = LAST(cpu_lim, time_bucket), wss = LAST(wss, time_bucket), rss = LAST(rss, time_bucket), mem_limit = LAST(mem_limit, time_bucket), mem_req = LAST(mem_req, time_bucket), mem_lim = LAST(mem_lim, time_bucket), disk = LAST(disk, time_bucket), disk_lim = LAST(disk_lim, time_bucket), pods = LAST(pods, time_bucket) BY {{label:namespace}}, {{label:container}}
        | EVAL cpu_ratio = CASE(quota > 0, cpu / (quota / 100000), NULL), wss_ratio = CASE(mem_limit > 0, wss / mem_limit, NULL), rss_ratio = CASE(mem_limit > 0, rss / mem_limit, NULL)

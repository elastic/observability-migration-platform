        | WHERE {{metric:container_network_receive_bytes_total:counter}} IS NOT NULL OR {{metric:container_network_transmit_bytes_total:counter}} IS NOT NULL OR {{metric:kube_pod_container_info:gauge}} IS NOT NULL
        | STATS rx = SUM(IRATE({{metric:container_network_receive_bytes_total:counter}})), tx = SUM(IRATE({{metric:container_network_transmit_bytes_total:counter}})), rx_rate = SUM(RATE({{metric:container_network_receive_bytes_total:counter}})), tx_rate = SUM(RATE({{metric:container_network_transmit_bytes_total:counter}})), info = MAX(LAST_OVER_TIME({{metric:kube_pod_container_info:gauge}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:namespace}}, {{label:pod}}, {{label:container}}
        | EVAL ctr = CASE(info IS NOT NULL AND (?Container IS NULL OR ?Container == "" OR ?Container == ".*" OR {{label:container}} == ?Container), TO_STRING({{label:container}}), NULL)
        | STATS rx = SUM(rx), tx = SUM(tx), rx_rate = SUM(rx_rate), tx_rate = SUM(tx_rate), ctrs = VALUES(ctr) BY time_bucket, {{label:namespace}}, {{label:pod}}
        | EVAL pod_ok = (?Pod IS NULL OR ?Pod == "" OR ?Pod == ".*" OR {{label:pod}} == ?Pod) AND (?Container IS NULL OR ?Container == "" OR ?Container == ".*" OR LOCATE(TO_STRING({{label:pod}}), ?Container) > 0)

      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?Node IS NULL OR ?Node == "" OR ?Node == ".*" OR {{label:node}} == ?Node
        | WHERE {{metric:kube_node_status_allocatable:gauge}} IS NOT NULL OR {{metric:container_memory_working_set_bytes:gauge}} IS NOT NULL OR {{metric:kube_pod_container_resource_requests:gauge}} IS NOT NULL OR {{metric:kube_pod_container_resource_limits:gauge}} IS NOT NULL
        | STATS total = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_node_status_allocatable:gauge}}), NULL)), usage = SUM(CASE({{label:container}} != "" AND {{label:container}} != "POD", LAST_OVER_TIME({{metric:container_memory_working_set_bytes:gauge}}), NULL)), requests = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_pod_container_resource_requests:gauge}}), NULL)), limits = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_pod_container_resource_limits:gauge}}), NULL)) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | STATS total = LAST(total, time_bucket), usage = LAST(usage, time_bucket), requests = LAST(requests, time_bucket), limits = LAST(limits, time_bucket)
        | EVAL __labels = MV_APPEND(MV_APPEND(MV_APPEND("Total Memory", "Usage"), "Requests"), "Limits")
        | EVAL __values = MV_APPEND(MV_APPEND(MV_APPEND(COALESCE(TO_STRING(total), ""), COALESCE(TO_STRING(usage), "")), COALESCE(TO_STRING(requests), "")), COALESCE(TO_STRING(limits), ""))

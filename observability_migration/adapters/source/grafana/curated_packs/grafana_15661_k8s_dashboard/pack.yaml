        | WHERE {{metric:kube_node_status_allocatable:gauge}} IS NOT NULL OR {{metric:container_cpu_usage_seconds_total:counter}} IS NOT NULL OR {{metric:kube_pod_container_resource_requests:gauge}} IS NOT NULL OR {{metric:kube_pod_container_resource_limits:gauge}} IS NOT NULL
        | STATS total = SUM(CASE({{label:resource}} == "cpu" AND {{label:unit}} == "core", LAST_OVER_TIME({{metric:kube_node_status_allocatable:gauge}}), NULL)), usage = SUM(CASE({{label:id}} == "/", IRATE({{metric:container_cpu_usage_seconds_total:counter}}), NULL)), requests = SUM(CASE({{label:resource}} == "cpu" AND {{label:unit}} == "core", LAST_OVER_TIME({{metric:kube_pod_container_resource_requests:gauge}}), NULL)), limits = SUM(CASE({{label:resource}} == "cpu" AND {{label:unit}} == "core", LAST_OVER_TIME({{metric:kube_pod_container_resource_limits:gauge}}), NULL)) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | EVAL __t_total = CASE(total IS NOT NULL, time_bucket, NULL), __t_usage = CASE(usage IS NOT NULL, time_bucket, NULL), __t_requests = CASE(requests IS NOT NULL, time_bucket, NULL), __t_limits = CASE(limits IS NOT NULL, time_bucket, NULL)
        | STATS total = LAST(total, __t_total), usage = LAST(usage, __t_usage), requests = LAST(requests, __t_requests), limits = LAST(limits, __t_limits)
        | EVAL __labels = MV_APPEND(MV_APPEND(MV_APPEND("Total Cores", "Usage"), "Requests"), "Limit")
        | EVAL __values = MV_APPEND(MV_APPEND(MV_APPEND(COALESCE(TO_STRING(total), ""), COALESCE(TO_STRING(usage), "")), COALESCE(TO_STRING(requests), "")), COALESCE(TO_STRING(limits), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "\t")
        | MV_EXPAND __pairs
        | EVAL label = MV_FIRST(SPLIT(__pairs, "\t")), value = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "\t")))
        | KEEP label, value
    - title_match: "Node Storage Information"
      panel_id: 73
      kibana_type_override: bar
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?Node IS NULL OR ?Node == "" OR ?Node == ".*" OR {{label:node}} == ?Node
        | WHERE {{metric:container_fs_usage_bytes:gauge}} IS NOT NULL OR {{metric:container_fs_limit_bytes:gauge}} IS NOT NULL
        | STATS usage = SUM(CASE({{label:id}} == "/" AND {{label:device}} RLIKE "/dev/.*", LAST_OVER_TIME({{metric:container_fs_usage_bytes:gauge}}), NULL)), total = SUM(CASE({{label:id}} == "/" AND {{label:device}} RLIKE "/dev/.*", LAST_OVER_TIME({{metric:container_fs_limit_bytes:gauge}}), NULL)) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | EVAL ratio = CASE(total > 0, usage / total, NULL)

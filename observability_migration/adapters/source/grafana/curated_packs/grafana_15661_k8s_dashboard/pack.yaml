        | STATS ratio = LAST(ratio, __t_ratio), usage = LAST(usage, __t_usage), total = LAST(total, __t_total)
        | EVAL __labels = MV_APPEND(MV_APPEND("Utilization Rate", "Usage"), "Total")
        | EVAL __values = MV_APPEND(MV_APPEND(COALESCE(TO_STRING(ratio), ""), COALESCE(TO_STRING(usage), "")), COALESCE(TO_STRING(total), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "\t")
        | MV_EXPAND __pairs
        | EVAL label = MV_FIRST(SPLIT(__pairs, "\t")), value = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "\t")))
        | KEEP label, value
    - title_match: "Workload"
      panel_id: 88
      kibana_type_override: metric
      approximation_note: "Total nodes, total pods, workload objects, and normal nodes (node count minus taint series whose key does not match node.kubernetes.io.*). With no such taints, Normal Node is the node count; the source subtracts an empty series and shows no value. The source also draws one stat per taint key. The pack titles the untitled strip Cluster counts."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{metric:kube_node_info:gauge}} IS NOT NULL OR {{metric:kube_pod_info:gauge}} IS NOT NULL OR {{metric:kube_deployment_metadata_generation:gauge}} IS NOT NULL OR {{metric:kube_daemonset_metadata_generation:gauge}} IS NOT NULL OR {{metric:kube_statefulset_metadata_generation:gauge}} IS NOT NULL OR {{metric:kube_node_spec_taint:gauge}} IS NOT NULL
        | STATS nodes = SUM(LAST_OVER_TIME({{metric:kube_node_info:gauge}})), pods = SUM(LAST_OVER_TIME({{metric:kube_pod_info:gauge}})), dep = SUM(LAST_OVER_TIME({{metric:kube_deployment_metadata_generation:gauge}})), ds = SUM(LAST_OVER_TIME({{metric:kube_daemonset_metadata_generation:gauge}})), sts = SUM(LAST_OVER_TIME({{metric:kube_statefulset_metadata_generation:gauge}})), custom_taints = SUM(CASE({{label:key}} IS NOT NULL AND NOT ({{label:key}} RLIKE "node.kubernetes.io.*"), LAST_OVER_TIME({{metric:kube_node_spec_taint:gauge}}), NULL)) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | EVAL workloads = CASE(dep IS NULL AND ds IS NULL AND sts IS NULL, NULL, COALESCE(dep, 0) + COALESCE(ds, 0) + COALESCE(sts, 0)), normal = nodes - COALESCE(custom_taints, 0)
        | EVAL __t_nodes = CASE(nodes IS NOT NULL, time_bucket, NULL), __t_pods = CASE(pods IS NOT NULL, time_bucket, NULL), __t_dep = CASE(dep IS NOT NULL, time_bucket, NULL), __t_ds = CASE(ds IS NOT NULL, time_bucket, NULL), __t_sts = CASE(sts IS NOT NULL, time_bucket, NULL), __t_workloads = CASE(workloads IS NOT NULL, time_bucket, NULL), __t_custom_taints = CASE(custom_taints IS NOT NULL, time_bucket, NULL), __t_normal = CASE(normal IS NOT NULL, time_bucket, NULL)
        | STATS nodes = LAST(nodes, __t_nodes), pods = LAST(pods, __t_pods), dep = LAST(dep, __t_dep), ds = LAST(ds, __t_ds), sts = LAST(sts, __t_sts), workloads = LAST(workloads, __t_workloads), custom_taints = LAST(custom_taints, __t_custom_taints), normal = LAST(normal, __t_normal)
        | EVAL __labels = MV_APPEND(MV_APPEND(MV_APPEND("Total Nodes", "Total Pod"), "Workload"), "Normal Node")
        | EVAL __values = MV_APPEND(MV_APPEND(MV_APPEND(COALESCE(TO_STRING(nodes), ""), COALESCE(TO_STRING(pods), "")), COALESCE(TO_STRING(workloads), "")), COALESCE(TO_STRING(normal), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "\t")
        | MV_EXPAND __pairs
        | EVAL label = MV_FIRST(SPLIT(__pairs, "\t")), value = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "\t")))
        | KEEP label, value
    - title_match: "Memory Usage"
      panel_id: 79
      kibana_type_override: line
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?Node IS NULL OR ?Node == "" OR ?Node == ".*" OR {{label:node}} == ?Node
        | WHERE {{metric:kube_node_status_allocatable:gauge}} IS NOT NULL OR {{metric:container_memory_working_set_bytes:gauge}} IS NOT NULL OR {{metric:kube_pod_container_resource_requests:gauge}} IS NOT NULL OR {{metric:kube_pod_container_resource_limits:gauge}} IS NOT NULL
        | STATS total = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_node_status_allocatable:gauge}}), NULL)), usage = SUM(CASE({{label:container}} != "", LAST_OVER_TIME({{metric:container_memory_working_set_bytes:gauge}}), NULL)), requests = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_pod_container_resource_requests:gauge}}), NULL)), limits = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_pod_container_resource_limits:gauge}}), NULL)) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | EVAL __labels = MV_APPEND(MV_APPEND(MV_APPEND("Total Memory", "Usage"), "Requests"), "Limit")
        | EVAL __values = MV_APPEND(MV_APPEND(MV_APPEND(COALESCE(TO_STRING(total), ""), COALESCE(TO_STRING(usage), "")), COALESCE(TO_STRING(requests), "")), COALESCE(TO_STRING(limits), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "\t")
        | MV_EXPAND __pairs
        | EVAL label = MV_FIRST(SPLIT(__pairs, "\t")), value = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "\t")))
        | KEEP time_bucket, label, value
        | SORT time_bucket ASC
    - title_match: "CPU Used Cores"
      panel_id: 80
      kibana_type_override: line
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend

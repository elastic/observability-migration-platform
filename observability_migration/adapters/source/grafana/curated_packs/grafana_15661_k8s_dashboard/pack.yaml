#
# Curated pack — Grafana dashboard 15661
# https://grafana.com/grafana/dashboards/15661
#
# K8S Dashboard, revision 2. Counters stay irate and gauges stay last
# values. Node, namespace, container, and pod are exact matches; an empty
# value or .* is every value. The origin_prometheus selector is omitted;
# that label is not a target field.

query:
  metrics_dataset_filter: "prometheus"

  metric_kinds:
    kube_node_info: gauge
    kube_node_status_allocatable: gauge
    kube_pod_info: gauge
    kube_pod_container_resource_requests: gauge
    kube_pod_container_resource_limits: gauge
    container_memory_working_set_bytes: gauge
    container_memory_rss: gauge
    container_fs_usage_bytes: gauge
    container_fs_limit_bytes: gauge
    container_spec_cpu_quota: gauge
    container_spec_memory_limit_bytes: gauge
    kube_service_info: gauge
    kube_configmap_info: gauge
    kube_secret_info: gauge
    kube_deployment_metadata_generation: gauge
    kube_daemonset_metadata_generation: gauge
    kube_statefulset_metadata_generation: gauge
    kube_node_spec_taint: gauge
    kubelet_volume_stats_used_bytes: gauge
    kubelet_volume_stats_available_bytes: gauge
    kube_pod_spec_volumes_persistentvolumeclaims_info: gauge
    kube_pod_container_info: gauge
    container_cpu_usage_seconds_total: counter
    container_network_receive_bytes_total: counter
    container_network_transmit_bytes_total: counter
    kube_pod_container_status_restarts_total: counter

  live_optional_metrics:
    - kube_node_status_allocatable
    - kube_pod_container_resource_requests
    - kube_pod_container_resource_limits
    - container_memory_working_set_bytes
    - container_memory_rss
    - container_fs_usage_bytes
    - container_fs_limit_bytes
    - container_spec_cpu_quota
    - container_spec_memory_limit_bytes
    - kube_service_info
    - kube_configmap_info
    - kube_secret_info
    - kube_deployment_metadata_generation
    - kube_daemonset_metadata_generation
    - kube_statefulset_metadata_generation
    - kube_node_spec_taint
    - kubelet_volume_stats_used_bytes
    - kubelet_volume_stats_available_bytes
    - kube_pod_spec_volumes_persistentvolumeclaims_info
    - kube_pod_container_info
    - container_network_receive_bytes_total
    - container_network_transmit_bytes_total
    - kube_pod_container_status_restarts_total

panel:
  query_overrides:
    - title_match: "Node Memory Ratio"
      panel_id: 44
      kibana_type_override: bar
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?Node IS NULL OR ?Node == "" OR ?Node == ".*" OR {{label:node}} == ?Node
        | WHERE {{metric:container_memory_working_set_bytes:gauge}} IS NOT NULL OR {{metric:kube_node_status_allocatable:gauge}} IS NOT NULL OR {{metric:kube_pod_container_resource_requests:gauge}} IS NOT NULL OR {{metric:kube_pod_container_resource_limits:gauge}} IS NOT NULL
        | STATS util_n = SUM(CASE({{label:container}} != "", LAST_OVER_TIME({{metric:container_memory_working_set_bytes:gauge}}), NULL)), alloc = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_node_status_allocatable:gauge}}), NULL)), req = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_pod_container_resource_requests:gauge}}), NULL)), lim = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_pod_container_resource_limits:gauge}}), NULL)) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | EVAL util = CASE(alloc > 0, util_n / alloc, NULL), request = CASE(alloc > 0, req / alloc, NULL), limit_ratio = CASE(alloc > 0, lim / alloc, NULL)
        | EVAL __t_util = CASE(util IS NOT NULL, time_bucket, NULL), __t_request = CASE(request IS NOT NULL, time_bucket, NULL), __t_limit_ratio = CASE(limit_ratio IS NOT NULL, time_bucket, NULL)
        | STATS util = LAST(util, __t_util), request = LAST(request, __t_request), limit_ratio = LAST(limit_ratio, __t_limit_ratio)
        | EVAL __labels = MV_APPEND(MV_APPEND("Memory Utilization", "Memory Request Rate"), "Memory Limit Rate")
        | EVAL __values = MV_APPEND(MV_APPEND(COALESCE(TO_STRING(util), ""), COALESCE(TO_STRING(request), "")), COALESCE(TO_STRING(limit_ratio), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "\t")
        | MV_EXPAND __pairs
        | EVAL label = MV_FIRST(SPLIT(__pairs, "\t")), value = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "\t")))
        | KEEP label, value
    - title_match: "Node CPU Ratio"
      panel_id: 45
      kibana_type_override: bar
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?Node IS NULL OR ?Node == "" OR ?Node == ".*" OR {{label:node}} == ?Node
        | WHERE {{metric:container_cpu_usage_seconds_total:counter}} IS NOT NULL OR {{metric:kube_node_status_allocatable:gauge}} IS NOT NULL OR {{metric:kube_pod_container_resource_requests:gauge}} IS NOT NULL OR {{metric:kube_pod_container_resource_limits:gauge}} IS NOT NULL
        | STATS util_n = SUM(CASE({{label:container}} != "", IRATE({{metric:container_cpu_usage_seconds_total:counter}}), NULL)), alloc = SUM(CASE({{label:resource}} == "cpu" AND {{label:unit}} == "core", LAST_OVER_TIME({{metric:kube_node_status_allocatable:gauge}}), NULL)), req = SUM(CASE({{label:resource}} == "cpu" AND {{label:unit}} == "core", LAST_OVER_TIME({{metric:kube_pod_container_resource_requests:gauge}}), NULL)), lim = SUM(CASE({{label:resource}} == "cpu" AND {{label:unit}} == "core", LAST_OVER_TIME({{metric:kube_pod_container_resource_limits:gauge}}), NULL)) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | EVAL util = CASE(alloc > 0, util_n / alloc, NULL), request = CASE(alloc > 0, req / alloc, NULL), limit_ratio = CASE(alloc > 0, lim / alloc, NULL)
        | EVAL __t_util = CASE(util IS NOT NULL, time_bucket, NULL), __t_request = CASE(request IS NOT NULL, time_bucket, NULL), __t_limit_ratio = CASE(limit_ratio IS NOT NULL, time_bucket, NULL)
        | STATS util = LAST(util, __t_util), request = LAST(request, __t_request), limit_ratio = LAST(limit_ratio, __t_limit_ratio)
        | EVAL __labels = MV_APPEND(MV_APPEND("CPU Utilization Rate", "CPU Request Rate"), "CPU Limit Rate")
        | EVAL __values = MV_APPEND(MV_APPEND(COALESCE(TO_STRING(util), ""), COALESCE(TO_STRING(request), "")), COALESCE(TO_STRING(limit_ratio), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "\t")
        | MV_EXPAND __pairs
        | EVAL label = MV_FIRST(SPLIT(__pairs, "\t")), value = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "\t")))
        | KEEP label, value
    - title_match: "Nodes with Pod"
      panel_id: 74
      kibana_type_override: bar
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{metric:kube_node_info:gauge}} IS NOT NULL OR {{metric:kube_pod_info:gauge}} IS NOT NULL OR {{metric:kube_node_status_allocatable:gauge}} IS NOT NULL
        | STATS nodes = SUM(LAST_OVER_TIME({{metric:kube_node_info:gauge}})), pods = SUM(CASE(({{label:created_by_kind}} IS NULL OR ({{label:created_by_kind}} != "<none>" AND {{label:created_by_kind}} != "Job")) AND (?Node IS NULL OR ?Node == "" OR ?Node == ".*" OR {{label:node}} == ?Node), LAST_OVER_TIME({{metric:kube_pod_info:gauge}}), NULL)), cap = SUM(CASE({{label:resource}} == "pods" AND {{label:unit}} == "integer" AND (?Node IS NULL OR ?Node == "" OR ?Node == ".*" OR {{label:node}} == ?Node), LAST_OVER_TIME({{metric:kube_node_status_allocatable:gauge}}), NULL)) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | EVAL __t_nodes = CASE(nodes IS NOT NULL, time_bucket, NULL), __t_pods = CASE(pods IS NOT NULL, time_bucket, NULL), __t_cap = CASE(cap IS NOT NULL, time_bucket, NULL)
        | STATS nodes = LAST(nodes, __t_nodes), pods = LAST(pods, __t_pods), cap = LAST(cap, __t_cap)
        | EVAL __labels = MV_APPEND(MV_APPEND("Number of nodes", "Pod Number of nodes"), "Upper limit Pod")
        | EVAL __values = MV_APPEND(MV_APPEND(COALESCE(TO_STRING(nodes), ""), COALESCE(TO_STRING(pods), "")), COALESCE(TO_STRING(cap), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "\t")
        | MV_EXPAND __pairs
        | EVAL label = MV_FIRST(SPLIT(__pairs, "\t")), value = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "\t")))
        | KEEP label, value
    - title_match: "Namespace Resource Statistics"
      panel_id: 51
      kibana_type_override: datatable
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{metric:kube_pod_info:gauge}} IS NOT NULL OR {{metric:kube_service_info:gauge}} IS NOT NULL OR {{metric:kube_deployment_metadata_generation:gauge}} IS NOT NULL OR {{metric:kube_daemonset_metadata_generation:gauge}} IS NOT NULL OR {{metric:kube_statefulset_metadata_generation:gauge}} IS NOT NULL OR {{metric:kube_configmap_info:gauge}} IS NOT NULL OR {{metric:kube_secret_info:gauge}} IS NOT NULL
        | STATS pods = SUM(CASE((?Node IS NULL OR ?Node == "" OR ?Node == ".*" OR {{label:node}} == ?Node), LAST_OVER_TIME({{metric:kube_pod_info:gauge}}), NULL)), svc = SUM(LAST_OVER_TIME({{metric:kube_service_info:gauge}})), dep = SUM(LAST_OVER_TIME({{metric:kube_deployment_metadata_generation:gauge}})), ds = SUM(LAST_OVER_TIME({{metric:kube_daemonset_metadata_generation:gauge}})), sts = SUM(LAST_OVER_TIME({{metric:kube_statefulset_metadata_generation:gauge}})), configmaps = SUM(LAST_OVER_TIME({{metric:kube_configmap_info:gauge}})), secrets = SUM(LAST_OVER_TIME({{metric:kube_secret_info:gauge}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:namespace}}
        | EVAL __t_pods = CASE(pods IS NOT NULL, time_bucket, NULL), __t_svc = CASE(svc IS NOT NULL, time_bucket, NULL), __t_dep = CASE(dep IS NOT NULL, time_bucket, NULL), __t_ds = CASE(ds IS NOT NULL, time_bucket, NULL), __t_sts = CASE(sts IS NOT NULL, time_bucket, NULL), __t_configmaps = CASE(configmaps IS NOT NULL, time_bucket, NULL), __t_secrets = CASE(secrets IS NOT NULL, time_bucket, NULL)
        | STATS pods = LAST(pods, __t_pods), svc = LAST(svc, __t_svc), dep = LAST(dep, __t_dep), ds = LAST(ds, __t_ds), sts = LAST(sts, __t_sts), configmaps = LAST(configmaps, __t_configmaps), secrets = LAST(secrets, __t_secrets) BY {{label:namespace}}
        | EVAL workloads = CASE(dep IS NULL AND ds IS NULL AND sts IS NULL, NULL, COALESCE(dep, 0) + COALESCE(ds, 0) + COALESCE(sts, 0))
        | KEEP {{label:namespace}}, pods, svc, workloads, configmaps, secrets
        | SORT {{label:namespace}} ASC
    - title_match: "Network Overview（Associable nodes and namespaces）"
      panel_id: 32
      kibana_type_override: line
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?Node IS NULL OR ?Node == "" OR ?Node == ".*" OR {{label:node}} == ?Node
        | WHERE ?NameSpace IS NULL OR ?NameSpace == "" OR ?NameSpace == ".*" OR {{label:namespace}} == ?NameSpace
        | WHERE {{metric:container_network_receive_bytes_total:counter}} IS NOT NULL OR {{metric:container_network_transmit_bytes_total:counter}} IS NOT NULL
        | STATS receive = SUM(IRATE({{metric:container_network_receive_bytes_total:counter}})), send = SUM(IRATE({{metric:container_network_transmit_bytes_total:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | EVAL receive = receive * 8, send = send * 8

        | EVAL __labels = MV_APPEND("Receive", "Send")
        | EVAL __values = MV_APPEND(COALESCE(TO_STRING(receive), ""), COALESCE(TO_STRING(send), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "\t")
        | MV_EXPAND __pairs
        | EVAL label = MV_FIRST(SPLIT(__pairs, "\t")), value = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "\t")))
        | KEEP time_bucket, label, value
        | SORT time_bucket ASC
    - title_match: "Node Memory Information"
      panel_id: 71
      kibana_type_override: bar
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?Node IS NULL OR ?Node == "" OR ?Node == ".*" OR {{label:node}} == ?Node
        | WHERE {{metric:kube_node_status_allocatable:gauge}} IS NOT NULL OR {{metric:container_memory_working_set_bytes:gauge}} IS NOT NULL OR {{metric:kube_pod_container_resource_requests:gauge}} IS NOT NULL OR {{metric:kube_pod_container_resource_limits:gauge}} IS NOT NULL
        | STATS total = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_node_status_allocatable:gauge}}), NULL)), usage = SUM(CASE({{label:container}} != "", LAST_OVER_TIME({{metric:container_memory_working_set_bytes:gauge}}), NULL)), requests = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_pod_container_resource_requests:gauge}}), NULL)), limits = SUM(CASE({{label:resource}} == "memory" AND {{label:unit}} == "byte", LAST_OVER_TIME({{metric:kube_pod_container_resource_limits:gauge}}), NULL)) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend)
        | EVAL __t_total = CASE(total IS NOT NULL, time_bucket, NULL), __t_usage = CASE(usage IS NOT NULL, time_bucket, NULL), __t_requests = CASE(requests IS NOT NULL, time_bucket, NULL), __t_limits = CASE(limits IS NOT NULL, time_bucket, NULL)
        | STATS total = LAST(total, __t_total), usage = LAST(usage, __t_usage), requests = LAST(requests, __t_requests), limits = LAST(limits, __t_limits)
        | EVAL __labels = MV_APPEND(MV_APPEND(MV_APPEND("Total Memory", "Usage"), "Requests"), "Limits")
        | EVAL __values = MV_APPEND(MV_APPEND(MV_APPEND(COALESCE(TO_STRING(total), ""), COALESCE(TO_STRING(usage), "")), COALESCE(TO_STRING(requests), "")), COALESCE(TO_STRING(limits), ""))
        | EVAL __pairs = MV_ZIP(__labels, __values, "\t")
        | MV_EXPAND __pairs
        | EVAL label = MV_FIRST(SPLIT(__pairs, "\t")), value = TO_DOUBLE(MV_LAST(SPLIT(__pairs, "\t")))
        | KEEP label, value
    - title_match: "Node CPU Number of cores"

        | EVAL __labels = MV_APPEND(MV_APPEND(MV_APPEND("Total Nodes", "Total Pod"), "Workload"), "Normal Node")
        | EVAL __values = MV_APPEND(MV_APPEND(MV_APPEND(COALESCE(TO_STRING(nodes), ""), COALESCE(TO_STRING(pods), "")), COALESCE(TO_STRING(workloads), "")), COALESCE(TO_STRING(normal), ""))

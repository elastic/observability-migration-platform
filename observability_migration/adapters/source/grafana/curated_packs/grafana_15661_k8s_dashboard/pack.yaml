      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?NameSpace IS NULL OR ?NameSpace == "" OR ?NameSpace == ".*" OR {{label:namespace}} == ?NameSpace
        | WHERE ?Container IS NULL OR ?Container == "" OR ?Container == ".*" OR {{label:container}} == ?Container
        | WHERE {{label:container}} != "" AND {{label:container}} != "POD"

#
# Curated pack — Grafana dashboard 747
# https://grafana.com/grafana/dashboards/747-pod-metrics/
#
# Source: community "Kubernetes Pod Metrics".
# Revision 2. schemaVersion 12 (old `rows[]` layout), 18 leaf panels.
# Metric family: cAdvisor container_* + machine_* AND kube-state-metrics
# (kube_pod_info, kube_pod_status_phase, kube_pod_container_info,
# kube_pod_container_status_restarts).
#
# Authored against a pre-1.16 cAdvisor + Heapster-era label lineage:
#   - pod_name / io_kubernetes_pod_name -> modern pod
#   - kubernetes_io_hostname            -> scrape instance
#   - kube_pod_container_status_restarts -> *_total (counter)
#   - markdown `# $Pod_ip` / `$phase` / `$container` (hidden vars, hide=2)
#     -> live Kibana metric tiles grouped by those labels
#
# Engine vs pack split:
#   Engine: rate()/gauge, rows[] -> sections, singlestat reducers,
#           ^$Pod$ exact matchers, hidden-variable skip, text->markdown.
#   Pack:   Heapster label bridge, Node via instance, Pod/Node multi-select,
#           text-panel ES|QL metric tiles, Received/Sent names, cgroup-id
#           All-processes, LAST_OVER_TIME gauges, named Used/Total tiles.

query:
  metrics_dataset_filter: "prometheus"

  metric_kinds:
    container_cpu_usage_seconds_total: counter
    container_network_receive_bytes_total: counter
    container_network_transmit_bytes_total: counter
    kube_pod_container_status_restarts: counter
    kube_pod_container_status_restarts_total: counter
    container_memory_working_set_bytes: gauge
    machine_cpu_cores: gauge
    machine_memory_bytes: gauge
    kube_pod_info: gauge
    kube_pod_status_phase: gauge
    kube_pod_container_info: gauge

  metric_map:
    kube_pod_container_status_restarts: kube_pod_container_status_restarts_total

  label_rewrites:
    pod_name: pod
    io_kubernetes_pod_name: pod
    kubernetes_io_hostname: instance

  source_label_names:
    pod: pod_name
    instance: kubernetes_io_hostname

  ignored_labels:
    - image
    - name

controls:
  field_overrides:
    Node: instance
    node: instance
    Pod: pod
    pod: pod

panel:
  query_overrides:
    # Grafana markdown `# $Pod_ip` cannot interpolate Kibana controls.
    # A datatable of pod → IP is the Kibana-native replacement (metric tiles
    # clip after ~3 values). `pod IS NOT NULL` is required: MV_CONTAINS on a
    # null label does not reject the root cgroup the way PromQL `pod=~` does.
    - title_match: "Pod IP Address"
      kibana_type_override: datatable
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | WHERE {{metric:kube_pod_info:gauge}} IS NOT NULL AND {{label:pod_ip}} IS NOT NULL
        | STATS ip = VALUES({{label:pod_ip}}) BY {{label:pod}}
        | RENAME `{{label:pod}}` AS pod
        | KEEP pod, ip
        | SORT pod ASC
      status_override: migrated
    - title_match: "Pod Status"
      kibana_type_override: metric
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | WHERE {{metric:kube_pod_status_phase:gauge}} IS NOT NULL AND {{label:phase}} IS NOT NULL
        | STATS computed_value = MAX(LAST_OVER_TIME({{metric:kube_pod_status_phase:gauge}})) BY {{label:phase}}
        | WHERE computed_value == 1
        | KEEP `{{label:phase}}`, computed_value
      status_override: migrated
    - title_match: "Pod Container"
      kibana_type_override: datatable
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | WHERE {{metric:kube_pod_container_info:gauge}} IS NOT NULL AND {{label:container}} IS NOT NULL
        | STATS container = VALUES({{label:container}}) BY {{label:pod}}
        | RENAME `{{label:pod}}` AS pod
        | KEEP pod, container
        | SORT pod ASC
      status_override: migrated
    - title_match: "Container restarts"
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | WHERE {{metric:kube_pod_container_status_restarts_total:counter}} IS NOT NULL
        | STATS computed_value = SUM(LAST_OVER_TIME({{metric:kube_pod_container_status_restarts_total:counter}}))
        | KEEP computed_value
      status_override: migrated

    - title_match: "Network I/O pressure"
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | WHERE {{metric:container_network_receive_bytes_total:counter}} IS NOT NULL OR {{metric:container_network_transmit_bytes_total:counter}} IS NOT NULL
        | STATS Received = SUM(RATE({{metric:container_network_receive_bytes_total:counter}})), Sent = 0 - SUM(RATE({{metric:container_network_transmit_bytes_total:counter}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend)
        | KEEP time_bucket, Received, Sent
        | SORT time_bucket ASC
      status_override: migrated

    - title_match: "Pod memory usage"
      section_match: "Total usage"
      panel_id: 4
      primary_format: percentunit
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (MV_CONTAINS(TO_STRING(?Node), ".*") OR MV_CONTAINS(TO_STRING(?Node), {{label:instance}}))
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}) OR {{label:pod}} IS NULL)
        | STATS used = SUM(CASE({{label:pod}} IS NOT NULL, LAST_OVER_TIME({{metric:container_memory_working_set_bytes:gauge}}), NULL)), total = SUM(LAST_OVER_TIME({{metric:machine_memory_bytes:gauge}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend)
        | EVAL computed_value = CASE(total > 0, used / total, NULL)
        | WHERE computed_value IS NOT NULL
        | SORT time_bucket DESC
        | LIMIT 1
        | KEEP computed_value
      status_override: migrated
    - title_match: "Pod CPU usage"
      section_match: "Total usage"
      panel_id: 6
      primary_format: percentunit
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (MV_CONTAINS(TO_STRING(?Node), ".*") OR MV_CONTAINS(TO_STRING(?Node), {{label:instance}}))
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}) OR {{label:pod}} IS NULL)
        | STATS used = SUM(CASE({{label:pod}} IS NOT NULL, RATE({{metric:container_cpu_usage_seconds_total:counter}}), NULL)), total = SUM(LAST_OVER_TIME({{metric:machine_cpu_cores:gauge}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend)
        | EVAL computed_value = CASE(total > 0, used / total, NULL)
        | WHERE computed_value IS NOT NULL
        | SORT time_bucket DESC
        | LIMIT 1
        | KEEP computed_value
      status_override: migrated
    - title_match: "Used"
      panel_id: 36
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | STATS computed_value = SUM(LAST_OVER_TIME({{metric:container_memory_working_set_bytes:gauge}}))
        | KEEP computed_value
      status_override: migrated
    - title_match: "Total"
      panel_id: 37
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (MV_CONTAINS(TO_STRING(?Node), ".*") OR MV_CONTAINS(TO_STRING(?Node), {{label:instance}}))
        | STATS computed_value = SUM(LAST_OVER_TIME({{metric:machine_memory_bytes:gauge}}))
        | KEEP computed_value
      status_override: migrated
    - title_match: "Used"
      panel_id: 38
      primary_format: short
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | STATS computed_value = SUM(RATE({{metric:container_cpu_usage_seconds_total:counter}}))
        | KEEP computed_value
      status_override: migrated
    # Grafana titles this "Total" but the PromQL is node-wide container CPU
    # rate (not machine_cpu_cores). Keep that semantics; Kibana title says so.
    - title_match: "Total"
      panel_id: 39
      primary_format: short
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (MV_CONTAINS(TO_STRING(?Node), ".*") OR MV_CONTAINS(TO_STRING(?Node), {{label:instance}}))
        | STATS computed_value = SUM(RATE({{metric:container_cpu_usage_seconds_total:counter}}))
        | KEEP computed_value
      status_override: migrated
    - title_match: "Pod memory working bytes"
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | STATS computed_value = SUM(LAST_OVER_TIME({{metric:container_memory_working_set_bytes:gauge}}))
        | KEEP computed_value
      status_override: migrated

    - title_match: "Pods CPU usage"
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | WHERE {{metric:container_cpu_usage_seconds_total:counter}} IS NOT NULL
        | STATS value = SUM(RATE({{metric:container_cpu_usage_seconds_total:counter}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend), {{label:pod}}
        | KEEP time_bucket, `{{label:pod}}`, value
        | SORT time_bucket ASC
      status_override: migrated
    - title_match: "Pods memory usage"
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | WHERE {{metric:container_memory_working_set_bytes:gauge}} IS NOT NULL
        | STATS value = SUM(LAST_OVER_TIME({{metric:container_memory_working_set_bytes:gauge}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend), {{label:pod}}
        | KEEP time_bucket, `{{label:pod}}`, value
        | SORT time_bucket ASC
      status_override: migrated
    - title_match: "Pods network I/O"
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | WHERE {{metric:container_network_receive_bytes_total:counter}} IS NOT NULL OR {{metric:container_network_transmit_bytes_total:counter}} IS NOT NULL
        | STATS Received = SUM(RATE({{metric:container_network_receive_bytes_total:counter}})), Sent = 0 - SUM(RATE({{metric:container_network_transmit_bytes_total:counter}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend), {{label:pod}}
        | KEEP time_bucket, `{{label:pod}}`, Received, Sent
        | SORT time_bucket ASC
      status_override: migrated
    - title_match: "All processes CPU usage"
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | WHERE {{metric:container_cpu_usage_seconds_total:counter}} IS NOT NULL AND {{label:id}} IS NOT NULL AND {{label:id}} != "/"
        | STATS value = SUM(RATE({{metric:container_cpu_usage_seconds_total:counter}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend), {{label:id}}
        | KEEP time_bucket, `{{label:id}}`, value
        | SORT time_bucket ASC
      status_override: migrated
    - title_match: "All processes memory usage"
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | WHERE {{metric:container_memory_working_set_bytes:gauge}} IS NOT NULL AND {{label:id}} IS NOT NULL AND {{label:id}} != "/"
        | STATS value = SUM(LAST_OVER_TIME({{metric:container_memory_working_set_bytes:gauge}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend), {{label:id}}
        | KEEP time_bucket, `{{label:id}}`, value
        | SORT time_bucket ASC
      status_override: migrated
    - title_match: "All processes network I/O"
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE {{label:pod}} IS NOT NULL
        | WHERE (MV_CONTAINS(TO_STRING(?Pod), ".*") OR MV_CONTAINS(TO_STRING(?Pod), {{label:pod}}))
        | WHERE {{label:id}} IS NOT NULL AND {{label:id}} != "/" AND ({{metric:container_network_receive_bytes_total:counter}} IS NOT NULL OR {{metric:container_network_transmit_bytes_total:counter}} IS NOT NULL)
        | STATS Received = SUM(RATE({{metric:container_network_receive_bytes_total:counter}})), Sent = 0 - SUM(RATE({{metric:container_network_transmit_bytes_total:counter}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend), {{label:id}}
        | KEEP time_bucket, `{{label:id}}`, Received, Sent
        | SORT time_bucket ASC
      status_override: migrated

  layout_overrides:
    - title_match: "Pod IP Address"
      position: {x: 0, y: 0}
      size: {w: 16, h: 12}
    - title_match: "Pod Status"
      position: {x: 16, y: 0}
      size: {w: 8, h: 12}
    - title_match: "Pod Container"
      position: {x: 24, y: 0}
      size: {w: 16, h: 12}
    - title_match: "Container restarts"
      position: {x: 40, y: 0}
      size: {w: 8, h: 12}
    - title_match: "Network I/O pressure"
      size: {w: 48, h: 12}
    - title_match: "Pod memory usage"
      section_match: "Total usage"
      panel_id: 4
      position: {x: 0, y: 0}
      size: {w: 24, h: 12}
    - title_match: "Pod CPU usage"
      section_match: "Total usage"
      panel_id: 6
      position: {x: 24, y: 0}
      size: {w: 24, h: 12}
    - title_match: "Used"
      panel_id: 36
      title: "Memory used"
      position: {x: 0, y: 12}
      size: {w: 8, h: 8}
    - title_match: "Total"
      panel_id: 37
      title: "Memory total"
      position: {x: 8, y: 12}
      size: {w: 8, h: 8}
    - title_match: "Used"
      panel_id: 38
      title: "CPU used"
      position: {x: 16, y: 12}
      size: {w: 8, h: 8}
    - title_match: "Total"
      panel_id: 39
      title: "Node CPU"
      position: {x: 24, y: 12}
      size: {w: 8, h: 8}
    - title_match: "Pod memory working bytes"
      position: {x: 32, y: 12}
      size: {w: 16, h: 8}
    - title_match: "Pods CPU usage"
      size: {w: 48, h: 12}
    - title_match: "Pods memory usage"
      size: {w: 48, h: 12}
    - title_match: "Pods network I/O"
      size: {w: 48, h: 12}
    - title_match: "All processes CPU usage"
      size: {w: 48, h: 12}
    - title_match: "All processes memory usage"
      size: {w: 48, h: 12}
    - title_match: "All processes network I/O"
      size: {w: 48, h: 12}

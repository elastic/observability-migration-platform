        | WHERE ?instance IS NULL OR ?instance == "" OR ?instance == ".*" OR {{label:instance}} == ?instance
        | WHERE {{label:job}} == "kubelet"
        | WHERE {{metric:storage_operation_duration_seconds_count:counter}} IS NOT NULL
        | STATS value = SUM(RATE({{metric:storage_operation_duration_seconds_count:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:instance}}, {{label:operation_name}}, {{label:volume_plugin}}
        | EVAL legend = CONCAT(TO_STRING({{label:instance}}), " ", TO_STRING({{label:operation_name}}), " ", TO_STRING({{label:volume_plugin}}))
        | STATS value = AVG(value) BY time_bucket, legend
        | KEEP time_bucket, legend, value
        | SORT time_bucket ASC
    - title_match: "Storage Operation Error Rate"
      panel_id: 14

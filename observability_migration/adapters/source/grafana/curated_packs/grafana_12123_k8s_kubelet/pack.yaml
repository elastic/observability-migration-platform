        | STATS cumulative = SUM(RATE({{metric:storage_operation_duration_seconds_bucket:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:instance}}, {{label:operation_name}}, {{label:volume_plugin}}, {{label:le}}
        | EVAL bound = CASE({{label:le}} == "+Inf", NULL, TO_DOUBLE({{label:le}}))
        | STATS total = MAX(CASE({{label:le}} == "+Inf", cumulative, NULL)), top = MAX(bound), pairs = VALUES(CASE(bound IS NOT NULL, CONCAT(TO_STRING(cumulative), "|", TO_STRING(bound)), NULL)) BY time_bucket, {{label:instance}}, {{label:operation_name}}, {{label:volume_plugin}}
        | MV_EXPAND pairs
        | EVAL cumulative = TO_DOUBLE(MV_FIRST(SPLIT(pairs, "|"))), bound = TO_DOUBLE(MV_LAST(SPLIT(pairs, "|")))
        | STATS p99 = MIN(CASE(total > 0 AND cumulative >= total * 0.989999999, bound, NULL)), total = MAX(total), top = MAX(top) BY time_bucket, {{label:instance}}, {{label:operation_name}}, {{label:volume_plugin}}
        | EVAL p99 = CASE(total > 0, COALESCE(p99, top), NULL)
        | EVAL legend = CONCAT(TO_STRING({{label:instance}}), " ", TO_STRING({{label:operation_name}}), " ", TO_STRING({{label:volume_plugin}}))
        | STATS p99 = AVG(p99) BY time_bucket, legend
        | KEEP time_bucket, legend, p99
        | SORT time_bucket ASC
    - title_match: "Cgroup manager operation rate"
      panel_id: 16
      kibana_type_override: line
      approximation_note: "The 5m rate window follows the dashboard time range. The legend is the instance and operation type so each kubelet stays its own series; the source legend is the operation type alone. The scrape metrics_path selector is omitted."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?cluster IS NULL OR ?cluster == "" OR {{label:cluster}} == ?cluster
        | WHERE ?instance IS NULL OR ?instance == "" OR ?instance == ".*" OR {{label:instance}} == ?instance
        | WHERE {{label:job}} == "kubelet"
        | WHERE {{metric:kubelet_cgroup_manager_duration_seconds_count:counter}} IS NOT NULL
        | STATS value = SUM(RATE({{metric:kubelet_cgroup_manager_duration_seconds_count:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:instance}}, {{label:operation_type}}
        | EVAL legend = CONCAT(TO_STRING({{label:instance}}), " ", TO_STRING({{label:operation_type}}))
        | STATS value = AVG(value) BY time_bucket, legend
        | KEEP time_bucket, legend, value
        | SORT time_bucket ASC
    - title_match: "Cgroup manager 99th quantile"
      panel_id: 17
      kibana_type_override: line
      approximation_note: "99th percentile from the classic histogram buckets. The point is the upper bound of the first bucket whose cumulative rate reaches 0.99, without in-bucket interpolation. The 5m rate window follows the dashboard time range. The scrape metrics_path selector is omitted."
      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE ?cluster IS NULL OR ?cluster == "" OR {{label:cluster}} == ?cluster
        | WHERE ?instance IS NULL OR ?instance == "" OR ?instance == ".*" OR {{label:instance}} == ?instance

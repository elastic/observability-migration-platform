  - title: "Global CPU  Usage"
    panel_id: 77
    fidelity: APPROXIMATE
    notes: "Real, Requests, and Limits as the source bargauge shows them after it averages the Linux and Windows bars into Real. Windows is omitted, so Real is the Linux busy fraction: sum of non-idle rates divided by CPU count. Requests and limits use machine_cpu_cores when that kube-prometheus recording rule is present, and the node CPU count otherwise. The ratio stays 0-1 so the percentunit tile can scale to percent points. An empty job selection is every job."
  - title: "Global RAM Usage"
    panel_id: 78
    fidelity: APPROXIMATE
    notes: "Real, Requests, and Limits. Windows is omitted, so Real is MemTotal minus MemAvailable, divided by MemTotal. Requests and limits are divided by machine_memory_bytes when that kube-prometheus recording rule is present, and by MemTotal otherwise. The ratio stays 0-1. An empty job selection is every job."
  - title: "Nodes"
    panel_id: 63
    fidelity: APPROXIMATE
    notes: "Count of nodes from the last 5 minutes before the end of the time range, like a Prometheus instant query. The source count(count by (node)) is one row per node, then a count of those rows."
  - title: "Namespaces"
    panel_id: 59
    fidelity: PERFECT

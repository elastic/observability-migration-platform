      esql_query: |
        TS metrics-*
        | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
        | WHERE (?cluster == "" OR ({{label:cluster}} RLIKE ?cluster OR ({{label:cluster}} IS NULL AND "" RLIKE ?cluster)))
        | WHERE (?job IS NULL OR ?job == "" OR MV_COUNT(?job) == 0 OR MV_CONTAINS(TO_STRING(?job), {{label:job}}))
        | WHERE {{label:device}} == "lo"
        | WHERE {{metric:node_network_receive_bytes_total:counter}} IS NOT NULL OR {{metric:node_network_transmit_bytes_total:counter}} IS NOT NULL
        | STATS rx = SUM(RATE({{metric:node_network_receive_bytes_total:counter}})), tx = SUM(RATE({{metric:node_network_transmit_bytes_total:counter}})) BY time_bucket = TBUCKET(75, ?_tstart, ?_tend), {{label:instance}}
        | EVAL instance = {{label:instance}}
        | EVAL received = rx, transmitted = -1 * tx
        | STATS received = AVG(received), transmitted = AVG(transmitted) BY time_bucket, instance
        | KEEP time_bucket, instance, received, transmitted

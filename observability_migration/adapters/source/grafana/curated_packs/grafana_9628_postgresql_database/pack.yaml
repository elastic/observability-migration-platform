#
# Curated pack — Grafana dashboard 9628
# https://grafana.com/grafana/dashboards/9628-postgresql-database/
#
# Source: "PostgreSQL Database" (postgres_exporter Prometheus scrape)
# Revision 1 (canonical grafana.com sha256 in registry.yaml). The community
# corpus pins revision 8 as a benchmark seed; this pack was validated against
# revision 1 (32 renderable panels + 3 named rows), not that later revision.
#
# Engine vs pack split (do not duplicate engine work here):
#   Engine: Grafana 5 singlestat root ``format``, native PROMQL for bare
#           gauges and top-level ``!= 0`` comparisons, ``irate()`` on typed
#           counters, query_result() skip (no Kibana populate equivalent).
#   Pack:   Helm ``release`` / ``kubernetes_namespace`` labels that this
#           dashboard's revision 1 filters on but typical scrapes do not
#           store; postgres_exporter v0.15 dropped
#           ``pg_postmaster_start_time_seconds``; Grafana ``rate()`` on
#           process memory gauges; ``query_result(pg_up{release=...})``
#           rewritten to ``label_values(pg_up, instance)`` so Instance is
#           a real Kibana control.

query:
  metrics_dataset_filter: "prometheus"

  ignored_labels:
    - release
    - kubernetes_namespace

  label_rewrites:
    instance: labels.instance
    job: labels.job
    datname: labels.datname
    state: labels.state
    mode: labels.mode
    short_version: labels.short_version

  metric_kinds:
    pg_stat_database_tup_fetched: counter
    pg_stat_database_tup_inserted: counter
    pg_stat_database_tup_updated: counter
    pg_stat_database_tup_returned: counter
    pg_stat_database_tup_deleted: counter
    pg_stat_database_xact_commit: counter
    pg_stat_database_xact_rollback: counter
    pg_stat_database_blks_hit: counter
    pg_stat_database_blks_read: counter
    pg_stat_database_conflicts: counter
    pg_stat_database_deadlocks: counter
    pg_stat_database_temp_bytes: counter
    pg_stat_bgwriter_buffers_backend_total: counter
    pg_stat_bgwriter_buffers_alloc_total: counter
    pg_stat_bgwriter_buffers_backend_fsync_total: counter
    pg_stat_bgwriter_buffers_checkpoint_total: counter
    pg_stat_bgwriter_buffers_clean_total: counter
    pg_stat_bgwriter_checkpoint_write_time_total: counter
    pg_stat_bgwriter_checkpoint_sync_time_total: counter
    process_cpu_seconds_total: counter
    pg_static: gauge
    pg_up: gauge
    pg_settings_max_connections: gauge
    pg_settings_shared_buffers_bytes: gauge
    pg_settings_effective_cache_size_bytes: gauge
    pg_settings_maintenance_work_mem_bytes: gauge
    pg_settings_work_mem_bytes: gauge
    pg_settings_max_wal_size_bytes: gauge
    pg_settings_random_page_cost: gauge
    pg_settings_seq_page_cost: gauge
    pg_settings_max_worker_processes: gauge
    pg_settings_max_parallel_workers: gauge
    pg_stat_activity_count: gauge
    pg_locks_count: gauge
    process_resident_memory_bytes: gauge
    process_virtual_memory_bytes: gauge
    process_open_fds: gauge
    process_start_time_seconds: gauge
    pg_postmaster_start_time_seconds: gauge

  live_optional_metrics:
    - pg_postmaster_start_time_seconds

  label_candidates:
    instance:
      - labels.instance
      - service.instance.id
      - host.name
    job:
      - labels.job
      - service.name
    datname:
      - labels.datname
      - datname
    state:
      - labels.state
      - state
    mode:
      - labels.mode
      - mode
    short_version:
      - labels.short_version
      - short_version

controls:
  field_overrides:
    instance: labels.instance
    datname: labels.datname
    mode: labels.mode

panel:
  query_overrides:
    # Grafana singlestat valueName=name + legend {{short_version}} shows the
    # version label, not the numeric 1 on pg_static.
    - title_match: "Version"
      kibana_type_override: metric
      esql_query: |
        TS metrics-*
        | WHERE (?instance == "" OR ({{label:instance}} RLIKE ?instance OR ({{label:instance}} IS NULL AND "" RLIKE ?instance)))
        | WHERE {{metric:pg_static:gauge}} IS NOT NULL
        | STATS computed_value = MAX(LAST_OVER_TIME({{metric:pg_static:gauge}})) BY labels.short_version
        | KEEP labels.short_version, computed_value
      status_override: migrated
    # postgres_exporter v0.15 no longer exports pg_postmaster_start_time_seconds.
    # process_start_time_seconds is the exporter process start (same scrape
    # target); DATE_DIFF yields seconds-ago for the duration-style tile.
    - title_match: "Start Time"
      esql_query: |
        TS metrics-*
        | WHERE (?instance == "" OR ({{label:instance}} RLIKE ?instance OR ({{label:instance}} IS NULL AND "" RLIKE ?instance)))
        | WHERE {{metric:process_start_time_seconds:gauge}} IS NOT NULL
        | STATS start = MAX(LAST_OVER_TIME({{metric:process_start_time_seconds:gauge}}))
        | EVAL computed_value = DATE_DIFF("seconds", TO_DATETIME(start * 1000), NOW())
        | KEEP computed_value
      status_override: migrated
    # Grafana rate() on RSS/VMS gauges 400s in ES|QL RATE() and is the wrong
    # aggregation even in Prometheus. Plot current gauge values.
    - title_match: "Average Memory Usage"
      esql_query: |
        TS metrics-*
        | WHERE (?instance == "" OR ({{label:instance}} RLIKE ?instance OR ({{label:instance}} IS NULL AND "" RLIKE ?instance)))
        | WHERE {{metric:process_resident_memory_bytes:gauge}} IS NOT NULL OR {{metric:process_virtual_memory_bytes:gauge}} IS NOT NULL
        | STATS Resident_Mem = AVG(LAST_OVER_TIME({{metric:process_resident_memory_bytes:gauge}})), Virtual_Mem = AVG(LAST_OVER_TIME({{metric:process_virtual_memory_bytes:gauge}})) BY time_bucket = TBUCKET(20, ?_tstart, ?_tend)
        | KEEP time_bucket, Resident_Mem, Virtual_Mem
        | SORT time_bucket ASC
      status_override: migrated

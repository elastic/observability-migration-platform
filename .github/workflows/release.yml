name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches pyproject version
        run: python scripts/check_release_version.py --tag "${{ github.ref_name }}"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for trusted publishing
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # PyPI publish stays disabled until a Trusted Publisher is configured for
      # project `obs-migrate` (Owner=elastic, Repository=observability-migration-platform,
      # Workflow=release.yml, Environment=pypi). See CONTRIBUTING.md Releasing.
      # Flip: delete the `if:` line below (or set it to true) after publisher setup.
      # Docs: https://docs.pypi.org/trusted-publishers/
      - name: Publish to PyPI (Trusted Publishing)
        if: ${{ false }}
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach artifacts + SBOM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            docs/licenses/sbom.cdx.json
